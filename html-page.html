<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>صفحة | SWEATER</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-config.js?v=1"></script><script src="./supabase-app.js?v=3"></script><script src="./auth-gateway.js?v=4"></script><style>@font-face{font-family:LamaSans;src:url('./fonts/LamaSans-Regular.woff2')}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f6f9;font-family:LamaSans,Arial,sans-serif}iframe{display:block;width:100%;height:100%;border:0;background:#fff}iframe[hidden]{display:none!important}.state{position:fixed;inset:0;display:grid;place-items:center;background:#f4f6f9;color:#64748b;z-index:2;text-align:center;padding:25px}.state i{display:block;margin-bottom:12px;color:#f96714;font-size:30px}.state strong{display:block;color:#172033;font-size:16px}.state p{font-size:10px}.state a{display:inline-flex;margin-top:8px;padding:10px 14px;border-radius:10px;background:#172033;color:#fff;text-decoration:none;font-size:10px;font-weight:700}</style></head>
<body><div class="state" id="state"><div><i class="fa-solid fa-spinner fa-spin"></i><strong>جارٍ تحميل الصفحة</strong></div></div><iframe id="page" sandbox="allow-scripts allow-forms allow-modals" hidden></iframe><script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/js/all.min.js"></script><script>(()=>{'use strict';const client=window.SweaterCloud?.client,slug=new URLSearchParams(location.search).get('page')||'';window.addEventListener('load',async()=>{await window.SweaterAuthReady?.catch(()=>null);if(!slug)return fail('الرابط غير مكتمل');const {data,error}=await client.from('html_pages').select('title,html_code,status').eq('slug',slug).maybeSingle();if(error||!data)return fail('الصفحة غير موجودة أو غير منشورة');document.title=`${data.title} | SWEATER`;$('page').srcdoc=data.html_code;$('page').hidden=false;$('state').remove()});function $(id){return document.getElementById(id)}function fail(message){$('state').innerHTML=`<div><i class="fa-regular fa-file-circle-xmark"></i><strong>${message}</strong><p>تأكد من الرابط أو تواصل مع مدير النظام.</p><a href="./index.html">العودة للمنصة</a></div>`}})();</script></body></html>
