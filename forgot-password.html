<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>استعادة الدخول | SWEATER</title>
  <link rel="stylesheet" href="./sweater-ui.css?v=6"><link rel="stylesheet" href="./local-studio.css?v=6">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 80% 10%,#fff0e6,transparent 30%),#f4f6f9;color:#172033;font-family:LamaSans,sans-serif}.card{width:min(440px,100%);padding:28px;border:1px solid #fff;border-radius:23px;background:#fff;box-shadow:0 25px 70px #0f172a14}.mark{width:50px;height:50px;display:grid;place-items:center;border-radius:15px;background:#fff1e8;color:#f96714;font-size:18px}.card h1{font-size:22px;margin:19px 0 7px}.card p{color:#748196;font-size:10px;line-height:1.9;margin:0 0 20px}.field label{display:block;margin-bottom:7px;color:#536176;font-size:9px;font-weight:900}.field input{width:100%;height:45px;border:1px solid #e5e7eb;border-radius:11px;padding:0 12px;outline:none;font:700 10px LamaSans;direction:ltr}.field input:focus{border-color:#f96714;box-shadow:0 0 0 3px #fff0e7}.notice{display:none;margin-top:12px;padding:12px;border-radius:10px;background:#f0fdf4;color:#047857;font-size:9px;line-height:1.8}.actions{display:flex;gap:8px;margin-top:18px}.actions button,.actions a{height:42px;flex:1;display:flex;align-items:center;justify-content:center;gap:7px;border:1px solid #e5e7eb;border-radius:11px;color:#566377;background:#fff;text-decoration:none;font:900 9px LamaSans}.actions button{background:#f96714;border-color:#f96714;color:#fff}</style>
</head>
<body><main class="card"><div class="mark"><i class="fa-solid fa-key"></i></div><h1>استعادة كلمة المرور</h1><p>أدخل بريد حسابك وسنرسل لك رابطًا آمنًا لإعادة تعيين كلمة المرور.</p><form id="resetForm"><div class="field"><label>البريد الإلكتروني</label><input name="email" type="email" required></div><div class="notice" id="notice"></div><div class="actions"><button><i class="fa-regular fa-paper-plane"></i> إرسال الرابط</button><a href="./login.html"><i class="fa-solid fa-arrow-right"></i> العودة</a></div></form></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-config.js?v=1"></script><script src="./supabase-app.js?v=3"></script>
<script>document.querySelector('#resetForm').onsubmit=async e=>{e.preventDefault();const button=e.currentTarget.querySelector('button'),notice=document.querySelector('#notice'),email=new FormData(e.currentTarget).get('email');button.disabled=true;const redirectTo=location.href.replace('forgot-password.html','login.html');const{error}=await SweaterCloud.client.auth.resetPasswordForEmail(email,{redirectTo});notice.style.display='block';notice.style.background=error?'#fff1f2':'#f0fdf4';notice.style.color=error?'#be123c':'#047857';notice.textContent=error?error.message:'إذا كان البريد مسجلًا، فسيصلك رابط الاستعادة خلال دقائق.';button.disabled=false}</script>
</body></html>
