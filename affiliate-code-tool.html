<script>(()=>{'use strict';const $=s=>document.querySelector(s),c=$('#canvas'),g=c.getContext('2d'),img=new Image(),KEY='sweaterAffiliatePosterV1',def=[{id:'code',text:'SWEATER20',x:1502,y:2325,size:170,color:'#fff',weight:900,align:'center',rotate:0,stroke:0}];let ls=[],id='code',z=1,drag=null,ready=false;const copy=v=>JSON.parse(JSON.stringify(v)),sel=()=>ls.find(v=>v.id===id),font=l=>`${l.weight} ${l.size}px LamaSans,Arial,sans-serif`;function load(){try{let s=JSON.parse(localStorage.getItem(KEY)||'null');ls=s?.layers?.length?s.layers:copy(def)}catch(e){ls=copy(def)}id=ls[0].id}function save(){localStorage.setItem(KEY,JSON.stringify({layers:ls}))}function safe(v){return String(v).replace(/[&<>]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[x]))}function draw(box=true){if(!ready)return;g.clearRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);ls.forEach(l=>{g.save();g.translate(l.x,l.y);g.rotate((l.rotate||0)*Math.PI/180);g.font=font(l);g.textAlign=l.align;g.textBaseline='middle';g.direction='rtl';if(l.stroke){g.lineWidth=l.stroke;g.strokeStyle='#003f72';g.strokeText(l.text,0,0)}g.fillStyle=l.color;g.fillText(l.text,0,0);if(box&&l.id===id){let w=g.measureText(l.text||' ').width+40;g.strokeStyle='#f96714';g.lineWidth=6;g.setLineDash([18,12]);g.strokeRect(-w/2,-l.size*.65,w,l.size*1.3)}g.restore()})}function list(){$('#layers').innerHTML='';ls.forEach((l,i)=>{let b=document.createElement('button');b.className='layer'+(l.id===id?' active':'');b.innerHTML=`<i class="fa-solid fa-grip-vertical"></i><span>${safe(l.text||'نص فارغ')}</span><small>${i+1}</small>`;b.onclick=()=>{id=l.id;list();sync();draw()};$('#layers').append(b)})}function sync(){let l=sel();$('#text').value=l.text;$('#size').value=l.size;$('#weight').value=l.weight;$('#color').value=l.color;$('#hex').value=l.color;$('#x').value=Math.round(l.x);$('#y').value=Math.round(l.y);$('#rotate').value=l.rotate||0;$('#stroke').value=l.stroke||0;document.querySelectorAll('[data-align]').forEach(b=>b.classLi c.onpointerdown=e=>{let p=point(e),l=hit(p);if(!l)return;id=l.id;drag={x:p.x-l.x,y:p.y-l.y};c.setPointerCapture(e.pointerId);list();sync();draw()};c.onpointermove=e=>{if(!drag)return;let p=point(e),l=sel();l.x=p.x-drag.x;l.y=p.y-drag.y;sync();draw()};c.onpointerup=()=>{drag=null;save()};$('#apply').onclick=()=>{let l=ls.find(v=>v.id==='code');if(!l){l=copy(def[0]);ls.unshift(l)}id='code';l.text=$('#code').value||'SWEATER20';save();list();sync();draw()};$('#add').onclick=()=>add();$('#copy').onclick=()=>add(sel());$('#del').onclick=()=>{if(ls.length<2)return $('#status').textContent='يجب إبقاء نص واحد على الأقل';ls=ls.filter(v=>v.id!==id);id=ls[0].id;save();list();sync();draw()};$('#text').oninput=e=>up({text:e.target.value});$('#size').onchange=e=>up({size:+e.target.value});$('#weight').onchange=e=>up({weight:+e.target.value});$('#color').oninput=e=>up({color:e.target.value});$('#hex').onchange=e=>/^#[\da-f]{6}$/i.test(e.target.value)&&up({color:e.target.value});$('#x').onchange=e=>up({x:+e.target.value});$('#y').onchange=e=>up({y:+e.target.value});$('#rotate').onchange=e=>up({rotate:+e.target.value});$('#stroke').onchange=e=>up({stroke:+e.target.value});document.querySelectorAll('[data-align]').forEach(b=>b.onclick=()=>up({align:b.dataset.align}));$('#minus').onclick=()=>{z=Math.max(.08,z-.05);az()};$('#plus').onclick=()=>{z=Math.min(1.2,z+.05);az()};$('#fit').onclick=fit;function exp(){draw(false);let f=$('#format').value,q=+$('#quality').value;requestAnimationFrame(()=>c.toBlob(blob=>{draw();let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='sweater-affiliate.'+(f==='jpeg'?'jpg':'png');a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);$('#status').textContent='تم تصدير الصورة بنجاح'},'image/'+f,q))}$('#export').onclick=exp;$('#topExport').onclick=exp;load();list();sync();window.addEventListener('sweater:apply-admin-template',e=>{const layers=e.detail?.payload?.layers;if(!Array.isArray(layers)||!layers.length)return;ls=copy(laye
