<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>أكواد التسويق بالعمولة | سويتر</title>
    <link rel="stylesheet" href="./sweater-ui.css?v=13" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <script src="./supabase-config.js?v=vercel1"></script>
    <script src="./supabase-app.js?v=affiliate1"></script>
    <script src="./auth-gateway.js?v=syncfix1"></script>
    <style>
      :root {
        --o: #f96714;
        --i: #171717;
        --m: #747474;
        --l: #e7e7e7;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f5f5f4;
        color: var(--i);
        font-family: LamaSans, Cairo, Arial, sans-serif;
      }
      button,
      input,
      select {
        font: inherit;
      }
      .head {
        height: 70px;
        padding: 0 28px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: #fff;
        border-bottom: 1px solid var(--l);
        position: sticky;
        top: 0;
        z-index: 10;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 11px;
        color: var(--i);
        text-decoration: none;
      }
      .mark {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        background: #fff2e8;
        color: var(--o);
      }
      .brand b,
      .brand small {
        display: block;
      }
      .brand small {
        color: var(--m);
        font-size: 10px;
        margin-top: 3px;
      }
      .btn {
        height: 42px;
        padding: 0 16px;
        border: 0;
        border-radius: 11px;
        background: var(--o);
        color: #fff;
        font-weight: 900;
        cursor: pointer;
      }
      .page {
        width: min(1320px, 100%);
        margin: auto;
        padding: 22px;
      }
      .intro {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        margin-bottom: 16px;
      }
      .intro em {
        font-style: normal;
        color: var(--o);
        font-size: 10px;
        font-weight: 900;
      }
      .intro h1 {
        margin: 5px 0 3px;
        font-size: 28px;
      }
      .intro p {
        margin: 0;
        color: var(--m);
        font-size: 12px;
      }
      .tip {
        max-width: 320px;
        background: #fff;
        border: 1px solid var(--l);
        border-radius: 12px;
        padding: 10px 13px;
        color: var(--m);
        font-size: 10px;
        line-height: 1.7;
      }
      .work {
        display: grid;
        grid-template-columns: 320px minmax(0, 1fr);
        gap: 16px;
        align-items: start;
        direction: ltr;
      }
      .panel,
      .preview {
        direction: rtl;
        background: #fff;
        border: 1px solid var(--l);
        border-radius: 16px;
      }
      .panel {
        padding: 16px;
        position: sticky;
        top: 90px;
        max-height: calc(100vh - 105px);
        overflow: auto;
      }
      .panel h2 {
        margin: 0 0 13px;
        font-size: 16px;
      }
      .quick {
        padding: 12px;
        border: 1px solid #fed7aa;
        background: #fff7ed;
        border-radius: 12px;
        margin-bottom: 12px;
      }
      label {
        display: block;
        margin: 0 0 6px;
        font-size: 10px;
        font-weight: 900;
        color: #57534e;
      }
      .row {
        display: flex;
        gap: 7px;
      }
      .field {
        width: 100%;
        height: 40px;
        padding: 0 10px;
        border: 1px solid var(--l);
        border-radius: 9px;
        background: #fff;
        outline: none;
      }
      .field:focus {
        border-color: var(--o);
        box-shadow: 0 0 0 3px #fff0e7;
      }
      .templates {
        margin-bottom: 13px;
      }
      .templates-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
      }
      .templates-head b {
        font-size: 10px;
      }
      .template-list {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 7px;
      }
      .template-card {
        aspect-ratio: 9/16;
        border: 2px solid transparent;
        border-radius: 9px;
        overflow: hidden;
        padding: 0;
        background: #eee;
        cursor: pointer;
        position: relative;
      }
      .template-card.active {
        border-color: var(--o);
        box-shadow: 0 0 0 3px #f9671420;
      }
      .template-card img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .template-card span {
        position: absolute;
        inset: auto 4px 4px;
        background: #fff;
        color: #171717;
        border-radius: 5px;
        padding: 3px;
        font-size: 7px;
        font-weight: 900;
        line-height: 1.2;
      }
      .add {
        width: 100%;
        height: 39px;
        border: 1px dashed var(--o);
        border-radius: 10px;
        background: #fff;
        color: var(--o);
        font-weight: 900;
        cursor: pointer;
        margin-bottom: 11px;
      }
      .layers {
        display: grid;
        gap: 6px;
        margin-bottom: 12px;
      }
      .layer {
        width: 100%;
        height: 42px;
        padding: 0 10px;
        border: 1px solid var(--l);
        border-radius: 9px;
        background: #fff;
        display: flex;
        align-items: center;
        gap: 8px;
        text-align: right;
        cursor: pointer;
      }
      .layer.active {
        border-color: var(--o);
        background: #fff7f2;
      }
      .layer span {
        min-width: 0;
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 11px;
        font-weight: 800;
      }
      .controls {
        display: grid;
        gap: 9px;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 7px;
      }
      .colors {
        display: flex;
        gap: 6px;
      }
      .colors input[type="color"] {
        width: 43px;
        height: 40px;
        padding: 4px;
        border: 1px solid var(--l);
        border-radius: 9px;
        background: #fff;
      }
      .align {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 4px;
      }
      .align button {
        height: 36px;
        border: 1px solid var(--l);
        border-radius: 8px;
        background: #fff;
      }
      .align button.active {
        background: var(--i);
        color: #fff;
      }
      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 7px;
      }
      .actions button {
        height: 38px;
        border: 1px solid var(--l);
        border-radius: 9px;
        background: #fff;
        font-size: 10px;
        font-weight: 900;
      }
      .actions .del {
        color: #c62828;
      }
      .export {
        margin-top: 13px;
        padding-top: 13px;
        border-top: 1px solid var(--l);
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 7px;
      }
      .export .btn {
        grid-column: 1/-1;
      }
      .status {
        grid-column: 1/-1;
        margin: 0;
        min-height: 14px;
        color: #16833c;
        font-size: 10px;
      }
      .preview {
        padding: 13px;
        min-height: 0;
      }
      .bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
      }
      .bar b {
        font-size: 11px;
      }
      .zoom {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 10px;
        color: var(--m);
      }
      .zoom button {
        width: 31px;
        height: 31px;
        border: 1px solid var(--l);
        border-radius: 8px;
        background: #fff;
      }
      .stage {
        height: calc(100vh - 190px);
        min-height: 560px;
        max-height: 760px;
        display: grid;
        place-items: center;
        overflow: auto;
        border-radius: 12px;
        background-color: #eeeae5;
        background-image: radial-gradient(#d6d3d1 1px, transparent 1px);
        background-size: 18px 18px;
      }
      .canvasbox {
        position: relative;
        margin: 0;
        line-height: 0;
        box-shadow: 0 18px 45px #2925242b;
      }
      canvas {
        display: block;
        width: auto;
        height: min(68vh, 680px);
        max-width: 100%;
        touch-action: none;
        cursor: grab;
      }
      .loading {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: #fff;
        color: var(--m);
        font-size: 11px;
      }
      .loading.hide {
        display: none;
      }
      @media (max-width: 950px) {
        .work {
          grid-template-columns: 1fr;
        }
        .panel {
          position: static;
          max-height: none;
        }
        .intro {
          align-items: start;
          flex-direction: column;
        }
        .tip {
          max-width: none;
          width: 100%;
        }
        .stage {
          height: auto;
          min-height: 520px;
        }
        canvas {
          height: min(68vh, 620px);
        }
      }
      @media (max-width: 520px) {
        .head {
          padding: 10px 14px;
          height: auto;
        }
        .brand small {
          display: none;
        }
        .page {
          padding: 12px;
        }
        .intro {
          display: none;
        }
        .grid {
          grid-template-columns: 1fr;
        }
        .preview {
          padding: 8px;
        }
        .stage {
          min-height: 430px;
        }
        canvas {
          height: min(62vh, 520px);
        }
      }
    </style>
  </head>
  <body>
    <style>
      .templates-head > span {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .template-upload {
        width: 24px;
        height: 24px;
        margin: 0;
        border: 1px solid #fed7aa;
        border-radius: 7px;
        color: var(--o);
        display: grid;
        place-items: center;
        cursor: pointer;
      }
    </style>
    <header class="head">
      <a class="brand" href="./index.html"
        ><span class="mark"><i class="fa-solid fa-link"></i></span
        ><span
          ><b>أكواد التسويق بالعمولة</b
          ><small>القالب الرسمي لسويتر</small></span
        ></a
      ><button class="btn" id="topExport">
        <i class="fa-solid fa-download"></i> تصدير
      </button>
    </header>
    <main class="page">
      <div class="intro">
        <div>
          <em>أداة التسويق</em>
          <h1>أضف الكود. صدّر التصميم.</h1>
          <p>قالب سويتر الأصلي مع نصوص قابلة للتحريك والتنسيق.</p>
        </div>
        <div class="tip">
          <i class="fa-regular fa-hand-pointer"></i> اختر النص واسحبه داخل
          الصورة، أو استخدم حقول X وY للحركة الدقيقة.
        </div>
      </div>
      <section class="work">
        <aside class="panel">
          <h2>محتوى التصميم</h2>
          <div class="quick">
            <label>كود المسوّق</label>
            <div class="row">
              <input
                class="field"
                id="code"
                dir="ltr"
                value="SWEATER20"
              /><button class="btn" id="apply">تطبيق</button>
            </div>
          </div>
          <div class="templates">
            <div class="templates-head">
              <b><i class="fa-regular fa-images"></i> القوالب</b
              ><span
                ><small id="templateCount"></small
                ><label class="template-upload" title="رفع قالب جديد"
                  ><i class="fa-solid fa-plus"></i
                  ><input
                    id="templateUpload"
                    type="file"
                    accept="image/*"
                    hidden /></label
              ></span>
            </div>
            <div class="template-list" id="templates"></div>
          </div>
          <button class="add" id="add">
            <i class="fa-solid fa-plus"></i> إضافة نص جديد
          </button>
          <div class="layers" id="layers"></div>
          <div class="controls">
            <div>
              <label>النص المحدد</label><input class="field" id="text" />
            </div>
            <div class="grid">
              <div>
                <label>حجم الخط</label
                ><input
                  id="sizeRange"
                  data-sw-number-ready="1"
                  type="range"
                  min="30"
                  max="360"
                  value="170"
                /><input
                  class="field"
                  id="size"
                  type="number"
                  min="30"
                  max="360"
                />
              </div>
              <div>
                <label>سماكة الخط</label
                ><select class="field" id="weight">
                  <option value="400">عادي</option>
                  <option value="700">عريض</option>
                  <option value="900">عريض جدًا</option>
                </select>
              </div>
            </div>
            <div class="grid">
              <div>
                <label>لون النص</label>
                <div class="colors">
                  <input id="color" type="color" /><input
                    class="field"
                    id="hex"
                    dir="ltr"
                  />
                </div>
              </div>
              <div>
                <label>المحاذاة</label>
                <div class="align">
                  <button data-align="right">
                    <i class="fa-solid fa-align-right"></i></button
                  ><button data-align="center">
                    <i class="fa-solid fa-align-center"></i></button
                  ><button data-align="left">
                    <i class="fa-solid fa-align-left"></i>
                  </button>
                </div>
              </div>
            </div>
            <div class="grid">
              <div>
                <label>الموقع X</label
                ><input class="field" id="x" type="number" />
              </div>
              <div>
                <label>الموقع Y</label
                ><input class="field" id="y" type="number" />
              </div>
            </div>
            <div class="grid">
              <div>
                <label>الدوران</label
                ><input class="field" id="rotate" type="number" />
              </div>
              <div>
                <label>حد النص</label
                ><input
                  class="field"
                  id="stroke"
                  type="number"
                  min="0"
                  max="30"
                />
              </div>
            </div>
            <div class="actions">
              <button id="copy"><i class="fa-regular fa-copy"></i> تكرار</button
              ><button class="del" id="del">
                <i class="fa-regular fa-trash-can"></i> حذف
              </button>
            </div>
          </div>
          <div class="export">
            <select class="field" id="format">
              <option value="png">PNG — أعلى جودة</option>
              <option value="jpeg">JPG — حجم أصغر</option></select
            ><select class="field" id="quality">
              <option value="1">100%</option>
              <option value="0.9">90%</option>
              <option value="0.8">80%</option></select
            ><button class="btn" id="export">
              <i class="fa-solid fa-download"></i> تصدير بالمقاس الأصلي
            </button>
            <p class="status" id="status"></p>
          </div>
        </aside>
        <section class="preview">
          <div class="bar">
            <b>المعاينة المباشرة</b>
            <div class="zoom">
              <button id="minus"><i class="fa-solid fa-minus"></i></button
              ><span id="zoom">100%</span
              ><button id="plus"><i class="fa-solid fa-plus"></i></button
              ><button id="fit"><i class="fa-solid fa-expand"></i></button>
            </div>
          </div>
          <div class="stage" id="stage">
            <div class="canvasbox">
              <canvas id="canvas" width="3004" height="5309"></canvas>
              <div class="loading" id="loading">
                <i class="fa-solid fa-spinner fa-spin"></i>&nbsp; جارٍ تحميل
                القالب
              </div>
            </div>
          </div>
        </section>
      </section>
    </main>
    <script>
      (() => {
        "use strict";
        const $ = (s) => document.querySelector(s),
          c = $("#canvas"),
          g = c.getContext("2d"),
          img = new Image(),
          KEY = "sweaterAffiliatePosterV1",
          BASE = "./assets/affiliate/marketing-code-template.png?v=1",
          def = [
            {
              id: "code",
              text: "SWEATER20",
              x: 1502,
              y: 2325,
              size: 170,
              color: "#fff",
              weight: 900,
              align: "center",
              rotate: 0,
              stroke: 0,
            },
          ];
        img.crossOrigin = "anonymous";
        let ls = [],
          id = "code",
          z = 1,
          drag = null,
          ready = false,
          currentTemplate = "built-in",
          currentBackground = localStorage.getItem("sweaterAffiliateTemplateBackground") || BASE;
        const copy = (v) => JSON.parse(JSON.stringify(v)),
          sel = () => ls.find((v) => v.id === id),
          font = (l) => `${l.weight} ${l.size}px LamaSans,Arial,sans-serif`;
        function load() {
          try {
            let s = JSON.parse(localStorage.getItem(KEY) || "null");
            ls = s?.layers?.length ? s.layers : copy(def);
          } catch (e) {
            ls = copy(def);
          }
          id = ls[0].id;
        }
        function save() {
          localStorage.setItem(KEY, JSON.stringify({ layers: ls }));
        }
        function safe(v) {
          return String(v).replace(
            /[&<>]/g,
            (x) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[x],
          );
        }
        function draw(box = true) {
          if (!ready) return;
          g.clearRect(0, 0, c.width, c.height);
          g.drawImage(img, 0, 0, c.width, c.height);
          ls.forEach((l) => {
            g.save();
            g.translate(l.x, l.y);
            g.rotate(((l.rotate || 0) * Math.PI) / 180);
            g.font = font(l);
            g.textAlign = l.align;
            g.textBaseline = "middle";
            g.direction = "rtl";
            if (l.stroke) {
              g.lineWidth = l.stroke;
              g.strokeStyle = "#003f72";
              g.strokeText(l.text, 0, 0);
            }
            g.fillStyle = l.color;
            g.fillText(l.text, 0, 0);
            if (box && l.id === id) {
              let w = g.measureText(l.text || " ").width + 40;
              g.strokeStyle = "#f96714";
              g.lineWidth = 6;
              g.setLineDash([18, 12]);
              g.strokeRect(-w / 2, -l.size * 0.65, w, l.size * 1.3);
            }
            g.restore();
          });
        }
        function list() {
          $("#layers").innerHTML = "";
          ls.forEach((l, i) => {
            let b = document.createElement("button");
            b.className = "layer" + (l.id === id ? " active" : "");
            b.innerHTML = `<i class="fa-solid fa-grip-vertical"></i><span>${safe(l.text || "نص فارغ")}</span><small>${i + 1}</small>`;
            b.onclick = () => {
              id = l.id;
              list();
              sync();
              draw();
            };
            $("#layers").append(b);
          });
        }
        function sync() {
          let l = sel();
          $("#text").value = l.text;
          $("#size").value = l.size;
          $("#sizeRange").value = l.size;
          $("#weight").value = l.weight;
          $("#color").value = l.color;
          $("#hex").value = l.color;
          $("#x").value = Math.round(l.x);
          $("#y").value = Math.round(l.y);
          $("#rotate").value = l.rotate || 0;
          $("#stroke").value = l.stroke || 0;
          document
            .querySelectorAll("[data-align]")
            .forEach((b) =>
              b.classList.toggle("active", b.dataset.align === l.align),
            );
          if (l.id === "code") $("#code").value = l.text;
        }
        function up(p) {
          Object.assign(sel(), p);
          save();
          list();
          sync();
          draw();
        }
        function add(base) {
          let l = base
            ? copy(base)
            : {
                text: "اكتب النص هنا",
                x: 1502,
                y: 1750,
                size: 120,
                color: "#fff",
                weight: 700,
                align: "center",
                rotate: 0,
                stroke: 0,
              };
          l.id = "t" + Date.now();
          if (base) {
            l.x += 45;
            l.y += 45;
          }
          ls.push(l);
          id = l.id;
          save();
          list();
          sync();
          draw();
        }
        function az() {
          c.style.width = c.width * z + "px";
          c.style.height = c.height * z + "px";
          $("#zoom").textContent = Math.round(z * 100) + "%";
        }
        function fit() {
          let s = $("#stage");
          z = Math.max(
            0.06,
            Math.min(
              1,
              (s.clientWidth - 32) / c.width,
              (s.clientHeight - 32) / c.height,
            ),
          );
          az();
        }
        function point(e) {
          let r = c.getBoundingClientRect();
          return {
            x: ((e.clientX - r.left) * c.width) / r.width,
            y: ((e.clientY - r.top) * c.height) / r.height,
          };
        }
        function hit(p) {
          for (let i = ls.length - 1; i >= 0; i--) {
            let l = ls[i];
            g.font = font(l);
            if (
              Math.abs(p.x - l.x) <= (g.measureText(l.text).width + 80) / 2 &&
              Math.abs(p.y - l.y) < l.size
            )
              return l;
          }
        }
        c.onpointerdown = (e) => {
          let p = point(e),
            l = hit(p);
          if (!l) return;
          id = l.id;
          drag = { x: p.x - l.x, y: p.y - l.y };
          c.setPointerCapture(e.pointerId);
          list();
          sync();
          draw();
        };
        c.onpointermove = (e) => {
          if (!drag) return;
          let p = point(e),
            l = sel();
          l.x = p.x - drag.x;
          l.y = p.y - drag.y;
          sync();
          draw();
        };
        c.onpointerup = () => {
          drag = null;
          save();
        };
        $("#apply").onclick = () => {
          let l = ls.find((v) => v.id === "code");
          if (!l) {
            l = copy(def[0]);
            ls.unshift(l);
          }
          id = "code";
          l.text = $("#code").value || "SWEATER20";
          save();
          list();
          sync();
          draw();
        };
        $("#add").onclick = () => add();
        $("#copy").onclick = () => add(sel());
        $("#del").onclick = () => {
          if (ls.length < 2)
            return ($("#status").textContent = "يجب إبقاء نص واحد على الأقل");
          ls = ls.filter((v) => v.id !== id);
          id = ls[0].id;
          save();
          list();
          sync();
          draw();
        };
        $("#text").oninput = (e) => up({ text: e.target.value });
        $("#size").oninput = (e) => up({ size: +e.target.value });
        $("#sizeRange").oninput = (e) => up({ size: +e.target.value });
        $("#weight").onchange = (e) => up({ weight: +e.target.value });
        $("#color").oninput = (e) => up({ color: e.target.value });
        $("#hex").onchange = (e) =>
          /^#[\da-f]{6}$/i.test(e.target.value) &&
          up({ color: e.target.value });
        $("#x").onchange = (e) => up({ x: +e.target.value });
        $("#y").onchange = (e) => up({ y: +e.target.value });
        $("#rotate").onchange = (e) => up({ rotate: +e.target.value });
        $("#stroke").onchange = (e) => up({ stroke: +e.target.value });
        document
          .querySelectorAll("[data-align]")
          .forEach((b) => (b.onclick = () => up({ align: b.dataset.align })));
        $("#minus").onclick = () => {
          z = Math.max(0.06, z - 0.03);
          az();
        };
        $("#plus").onclick = () => {
          z = Math.min(1, z + 0.03);
          az();
        };
        $("#fit").onclick = fit;
        function exp() {
          draw(false);
          let f = $("#format").value,
            q = +$("#quality").value;
          requestAnimationFrame(() =>
            c.toBlob(
              (blob) => {
                draw();
                let u = URL.createObjectURL(blob),
                  a = document.createElement("a");
                a.href = u;
                a.download =
                  "sweater-affiliate." + (f === "jpeg" ? "jpg" : "png");
                a.click();
                setTimeout(() => URL.revokeObjectURL(u), 1000);
                $("#status").textContent = "تم تصدير الصورة بنجاح";
              },
              "image/" + f,
              q,
            ),
          );
        }
        $("#export").onclick = exp;
        $("#topExport").onclick = exp;
        function useTemplate(t) {
          const p = t.payload || {};
          currentTemplate = t.id;
          document
            .querySelectorAll(".template-card")
            .forEach((card) =>
              card.classList.toggle("active", card.dataset.id === t.id),
            );
          if (Array.isArray(p.layers) && p.layers.length) {
            ls = copy(p.layers);
            id = ls[0].id;
            save();
            list();
            sync();
          }
          const url = p.background || p.url || t.preview || BASE;
          currentBackground = url;
          localStorage.setItem("sweaterAffiliateTemplateBackground", url);
          ready = false;
          $("#loading").classList.remove("hide");
          img.src = url;
        }
        function renderTemplates() {
          const managed =
            window.SweaterAdmin?.getTemplates?.("affiliate-codes") || [];
          const templates = [
            {
              id: "built-in",
              name: "القالب الأساسي",
              preview: BASE,
              payload: { background: BASE },
            },
            ...managed.filter((t) => t.status !== "inactive"),
          ];
          $("#templateCount").textContent = `${templates.length} قالب`;
          $("#templates").innerHTML = "";
          templates.forEach((t) => {
            const p = t.payload || {},
              url = p.background || p.url || t.preview || BASE,
              b = document.createElement("button");
            b.type = "button";
            b.className =
              "template-card" + (t.id === currentTemplate ? " active" : "");
            b.dataset.id = t.id;
            b.innerHTML = `<img src="${safe(url)}" alt=""><span>${safe(t.name || "قالب")}</span>`;
            b.onclick = () => useTemplate(t);
            $("#templates").append(b);
          });
        }
        $("#templateUpload").addEventListener("change", async (event) => {
          const file = event.target.files?.[0];
          if (!file) return;
          $("#loading").classList.remove("hide");
          try {
            let url;
            if (window.SweaterAuth?.isAdmin?.() && window.SweaterAdmin?.uploadAsset) {
              url = await window.SweaterAdmin.uploadAsset(file, "templates");
            } else {
              url = await new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
              });
            }
            useTemplate({ id: `upload-${Date.now()}`, name: file.name, preview: url, payload: { background: url } });
            $("#status").textContent = "تم تحميل القالب الجديد";
          } catch (error) {
            $("#status").textContent = error.message || "تعذر تحميل القالب";
          } finally {
            event.target.value = "";
          }
        });
        load();
        list();
        sync();
        window.addEventListener("sweater:apply-admin-template", (e) =>
          useTemplate(e.detail),
        );
        img.onload = async () => {
          c.width = img.naturalWidth || 3004;
          c.height = img.naturalHeight || 5309;
          ready = true;
          await document.fonts.ready;
          $("#loading").classList.add("hide");
          draw();
          requestAnimationFrame(fit);
        };
        img.onerror = () => {
          $("#loading").innerHTML = "<span>تعذر تحميل صورة القالب</span>";
        };
        img.src = currentBackground;
        window.addEventListener("resize", () => requestAnimationFrame(fit));
        window.addEventListener("load", async () => {
          await window.SweaterAdmin?.ready?.catch(() => null);
          renderTemplates();
        });
      })();
    </script>
    <script src="./brand-palette.js?v=1"></script>
    <script src="./site-config.js?v=header-clean3"></script>
  </body>
</html>
