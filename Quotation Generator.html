<body>
  <header class="app-head">
    <div class="head-group">
      <a class="back" href="./index.html" aria-label="العودة"><i class="fa-solid fa-arrow-right"></i></a>
      <div class="brand-title"><div class="title-mark"><i class="fa-solid fa-file-invoice-dollar"></i></div><div><strong>إنشاء عرض سعر</strong><span>اكتب مباشرة داخل المستند</span></div></div>
    </div>
    <div class="actions controls-container">
      <div class="save-state" id="saveState"><i class="fa-solid fa-cloud-check"></i><span>محفوظ تلقائيًا</span></div>
      <button class="btn secondary" id="savedBtn"><i class="fa-solid fa-folder-open"></i><span>العروض</span></button>
      <button class="btn secondary" id="newBtn"><i class="fa-solid fa-plus"></i><span>عرض جديد</span></button>
      <button class="icon-btn" id="darkBtn" aria-label="تبديل المظهر"><i class="fa-solid fa-moon"></i></button>
      <button class="btn primary" id="pdfBtn"><i class="fa-solid fa-file-pdf"></i><span>تصدير PDF</span></button>
    </div>
  </header>

  <section class="quickbar" aria-label="إعدادات العرض السريعة">
    <label class="quick-control"><i class="fa-solid fa-percent"></i>الضريبة<input id="vatRate" type="number" min="0" max="100" value="15">%</label>
    <label class="quick-control"><i class="fa-solid fa-tag"></i>الخصم<input id="discountValue" type="number" min="0" value="0">%</label>
  </section>

  <main class="workspace">
    <div class="paper-shell">
      <div class="edit-tip"><i class="fa-solid fa-pen"></i>اضغط على أي نص داخل عرض السعر واكتب مباشرة</div>
      <article class="paper" id="paper">
        <header class="paper-head">
          <img class="sweater-logo" src="./assets/sweater-logo.png" alt="شعار SWEATER">
          <div class="quote-heading">
            <h1>QUOTATION</h1>
            <div class="editable" contenteditable="true" data-field="quoteTitle" data-placeholder="عنوان عرض السعر"></div>
          </div>
        </header>

        <section class="meta-grid">
          <div class="meta"><label>رقم عرض السعر</label><div class="editable" contenteditable="true" data-field="quoteNumber" data-placeholder="SW-0001"></div></div>
          <div class="meta"><label>تاريخ الإصدار</label><input class="edit-input" data-field="quoteDate" type="date"></div>
          <div class="meta"><label>صالح حتى</label><input class="edit-input" data-field="expiryDate" type="date"></div>
        </section>

        <section class="parties">
          <div class="party">
            <h3><i class="fa-solid fa-building"></i>مقدم من</h3>
            <div class="editable party-name" contenteditable="true" data-field="companyName" data-placeholder="اسم الشركة"></div>
            <div class="editable party-lines" contenteditable="true" data-field="companyDetails" data-placeholder="السجل التجاري، الرقم الضريبي، العنوان"></div>
          </div>
          <div class="party">
            <h3><i class="fa-solid fa-user-tie"></i>مقدم إلى</h3>
            <div class="editable party-name" contenteditable="true" data-field="clientName" data-placeholder="اسم العميل أو الجهة"></div>
            <div class="editable party-lines" contenteditable="true" data-field="clientDetails" data-placeholder="مسؤول التواصل، الهاتف، البريد، العنوان"></div>
          </div>
        </section>

        <table class="items-table">
          <thead><tr><th style="width:43%">وصف الخدمة</th><th style="width:11%;text-align:center">الكمية</th><th style="width:12%;text-align:center">الوحدة</th><th style="width:16%;text-align:center">السعر</th><th style="width:16%;text-align:center">الإجمالي</th><th style="width:2%"></th></tr></thead>
          <tbody id="itemsBody"></tbody>
        </table>
        <button class="add-row" id="addItem"><i class="fa-solid fa-plus"></i> إضافة بند</button>

        <section class="paper-bottom">
          <div>
            <div class="text-block"><h3>ملاحظات</h3><div class="editable" contenteditable="true" data-field="notes" data-placeholder="اكتب ملاحظات العرض هنا"></div></div>
            <div class="text-block"><h3>شروط الدفع</h3><div class="editable" contenteditable="true" data-field="paymentTerms" data-placeholder="اكتب شروط الدفع"></div></div>
            <div class="text-block"><h3>البيانات البنكية</h3><div class="editable" contenteditable="true" data-field="bankDetails" data-placeholder="اسم البنك ورقم الآيبان"></div></div>
          </div>
          <div class="totals">
            <div class="total-line"><span>المجموع الفرعي</span><strong id="subtotal"><span class="money-value"><bdi>0.00</bdi><img class="riyal-icon" src="./assets/saudi-riyal-symbol.svg" alt="ريال سعودي"></span></strong></div>
            <div class="total-line"><span>الخصم</span><strong id="discount"><span class="money-value"><bdi>0.00</bdi><img class="riyal-icon" src="./assets/saudi-riyal-symbol.svg" alt="ريال سعودي"></span></strong></div>
            <div class="total-line"><span>الضريبة</span><strong id="vat"><span class="money-value"><bdi>0.00</bdi><img class="riyal-icon" src="./assets/saudi-riyal-symbol.svg" alt="ريال سعودي"></span></strong></div>
            <div class="total-line grand"><span>الإجمالي</span><strong id="grand"><span class="money-value"><bdi>0.00</bdi><img class="riyal-icon" src="./assets/saudi-riyal-symbol.svg" alt="ريال سعودي"></span></strong></div>
          </div>
        </section>

        <footer class="paper-footer"><div class="editable" contenteditable="true" data-field="contact" data-placeholder="Business@sweater.sa · +966 56 999 0806"></div><strong>WWW.SWEATER.SA</strong></footer>
      </article>
    </div>
  </main>

  <div class="floating-tools">
    <button class="float-btn" id="saveBtn"><i class="fa-solid fa-floppy-disk"></i> حفظ</button>
    <button class="float-btn" id="printBtn"><i class="fa-solid fa-print"></i> طباعة</button>
    <button class="float-btn accent" id="quickPdf"><i class="fa-solid fa-download"></i> PDF</button>
  </div>

  <div class="modal" id="savedModal">
    <div class="modal-card">
      <header class="modal-head"><h2>عروض الأسعار المحفوظة</h2><button class="icon-btn" id="closeSaved" aria-label="إغلاق"><i class="fa-solid fa-xmark"></i></button></header>
      <div class="saved-list" id="savedList"></div>
    </div>
  </div>
  <div class="toast-wrap" id="toasts"></div>

  <script>
  (() => {

    const $$=selector=>[...document.querySelectorAll(selector)];
    const STORAGE='sweaterQuoteStudioV3',DRAFT='sweaterQuotationAutosaveV2',SEQ='sweaterQuoteSequenceV3';

    const newItem=(data={})=>({id:data.id||uid(),description:data.description||data.name||'خدمة جديدة',qty:num(data.qty)||1,unit:data.unit||'خدمة',price:num(data.price)||0});
    const numberFormat=new Intl.NumberFormat('en-US',{minimumFractionDigits:2,maximumFractionDigits:2,useGrouping:true});
    const riyalSymbol='<svg class="riyal-icon" viewBox="0 0 1124.14 1256.39" role="img" aria-label="ريال سعودي" xmlns="http://www.w3.org/2000/svg"><path fill="currentColor" d="M699.62 1113.02c-20.06 44.48-33.32 92.75-38.4 143.37l424.51-90.24c20.06-44.47 33.31-92.75 38.4-143.37l-424.51 90.24Z"/><path fill="currentColor" d="M1085.73 895.8c20.06-44.47 33.32-92.75 38.4-143.37l-330.68 70.33v-135.2l292.27-62.11c20.06-44.47 33.32-92.75 38.4-143.37l-330.68 70.27V66.13c-50.67 28.45-95.67 66.32-132.25 110.99v403.35l-132.25 28.11V0c-50.67 28.44-95.67 66.32-132.25 110.99v525.69l-295.91 62.88c-20.06 44.47-33.33 92.75-38.42 143.37l334.33-71.05v170.26l-358.3 76.14c-20.06 44.47-33.32 92.75-38.4 143.37l375.04-79.7c30.53-6.35 56.77-24.4 73.83-49.24l68.78-101.97c7.14-10.57 11.3-23.29 11.3-36.99v-149.98l132.25-28.11v270.4l424.53-90.28Z"/></svg>';
    const money=value=>`<span class="money-value"><bdi>${numberFormat.format(value)}</bdi>${riyalSymbol}</span>`;
    function toast(message){const el=document.createElement('div');el.className='toast';el.textContent=message;$('#toasts').append(el);setTimeout(()=>el.remove(),2800)}
    function totals(){const subtotal=state.items.reduce((sum,item)=>sum+num(item.qty)*num(item.price),0);const discount=subtotal*Math.min(num(state.discountValue),100)/100;const taxable=Math.max(0,subtotal-discount);const vat=taxable*Math.min(num(state.vatRate),100)/100;return{subtotal,discount,vat,grand:taxable+vat}}
    function renderTotals(){const total=totals();$('#subtotal').innerHTML=money(total.subtotal);$('#discount').innerHTML=money(total.discount?-total.discount:0);$('#vat').innerHTML=money(total.vat);$('#grand').innerHTML=money(total.grand)}
    function renderItems(){
      $('#itemsBody').innerHTML=state.items.map((item,index)=>`<tr data-id="${item.id}">
        <td><div class="editable item-desc" contenteditable="true" data-key="description" data-placeholder="وصف الخدمة">${esc(item.description)}</div></td>
        <td><input class="cell-input" data-key="qty" type="number" min="0" step="1" value="${item.qty}" aria-label="كمية البند ${index+1}"></td>
        <td><div class="editable item-unit center" contenteditable="true" data-key="unit" data-placeholder="وحدة">${esc(item.unit)}</div></td>
        <td><input class="cell-input" data-key="price" type="number" min="0" step="0.01" value="${item.price}" aria-label="سعر البند ${index+1}"></td>
        <td class="center item-total">${money(item.qty*item.price)}</td>
        <td><button class="remove-row" data-remove="${item.id}" aria-label="حذف البند"><i class="fa-solid fa-xmark"></i></button></td>
      </tr>`).join('');
      $$('#itemsBody tr').forEach(row=>row.addEventListener('input',event=>{const item=state.items.find(entry=>entry.id===row.dataset.id),key=event.target.dataset.key;if(!item||!key)return;item[key]=['qty','price'].includes(key)?num(event.target.value):event.target.innerText;row.querySelector('.item-total').innerHTML=money(item.qty*item.price);renderTotals();queueSave()}));
      $$('[data-remove]').forEach(button=>button.onclick=()=>{if(state.items.length===1){toast('يجب إبقاء بند واحد على الأقل');return}state.items=state.items.filter(item=>item.id!==button.dataset.remove);renderItems();renderTotals();queueSave()});
    }
    function applyState(data){
      const normalized={...data};
      if(!normalized.companyDetails&&data.companyName)normalized.companyDetails=[data.companyCr&&`السجل التجاري: ${data.companyCr}`,data.companyVat&&`الرقم الضريبي: ${data.companyVat}`,data.companyAddress].filter(Boolean).join('\n');
      if(!normalized.clientDetails&&data.clientName)normalized.clientDetails=[data.clientContact,data.clientPhone,data.clientEmail,data.clientAddress].filter(Boolean).join('\n');
      state={...state,...normalized,items:(normalized.items||state.items).map(newItem)};
      if(!state.items.length)state.items=[newItem()];
      $$('[data-field]').forEach(element=>{const key=element.dataset.field;if(element.matches('input'))element.value=state[key]||'';else element.innerText=state[key]||''});
      $('#vatRate').value=state.vatRate;$('#discountValue').value=state.discountValue;renderItems();renderTotals()
    }
    function collect(){
      $$('[data-field]').forEach(element=>{state[element.dataset.field]=element.matches('input')?element.value:element.innerText.trim()});
      state.vatRate=num($('#vatRate').value);state.discountValue=num($('#discountValue').value);
      return{...state,items:state.items.map(item=>({...item})),updatedAt:new Date().toISOString()}
    }
    function queueSave(){clearTimeout(saveTimer);$('#saveState span').textContent='جارٍ الحفظ…';saveTimer=setTimeout(()=>{localStorage.setItem(DRAFT,JSON.stringify(collect()));$('#saveState span').textContent='محفوظ تلقائيًا'},400)}
    function savedQuotes(){try{return JSON.parse(localStorage.getItem(STORAGE)||'[]')}catch(_){return[]}}
    function saveQuote(showMessage=true){const quote=collect(),list=savedQuotes();quote.id=quote.id||uid();quote.name=quote.clientName?`${quote.clientName} — ${quote.quoteNumber}`:`عرض ${quote.quoteNumber}`;const index=list.findIndex(item=>item.id===quote.id);if(index>=0)list[index]=quote;else list.unshift(quote);state.id=quote.id;localStorage.setItem(STORAGE,JSON.stringify(list));localStorage.setItem(DRAFT,JSON.stringify(quote));if(showMessage)toast('تم حفظ عرض السعر')}
    function renderSaved(){const list=savedQuotes();$('#savedList').innerHTML=list.length?list.map(quote=>`<article class="saved-row"><i class="fa-solid fa-file-invoice-dollar"></i><div class="saved-main"><strong>${esc(quote.name||quote.quoteNumber)}</strong><span>${esc(quote.clientName||'بدون عميل')} · ${esc(quote.quoteDate||'')}</span></div><button data-open="${quote.id}" title="فتح"><i class="fa-solid fa-arrow-up-right-from-square"></i></button><button data-delete="${quote.id}" title="حذف"><i class="fa-solid fa-trash"></i></button></article>`).join(''):'<div class="empty"><i class="fa-regular fa-folder-open"></i><br><br>لا توجد عروض محفوظة بعد</div>';$$('[data-open]').forEach(button=>button.onclick=()=>{applyState(list.find(item=>item.id===button.dataset.open));$('#savedModal').classList.remove('open');toast('تم فتح العرض')});$$('[data-delete]').forEach(button=>button.onclick=()=>{if(!confirm('حذف هذا العرض؟'))return;localStorage.setItem(STORAGE,JSON.stringify(list.filter(item=>item.id!==button.dataset.delete)));renderSaved()})}
    function newQuote(){if(!confirm('بدء عرض سعر جديد؟'))return;applyState({id:null,quoteTitle:'عرض سعر خدمات سويتر',quoteNumber:nextNumber(),quoteDate:today(),expiryDate:plusDays(today(),15),clientName:'',clientDetails:'',notes:'الأسعار تشمل المواد والمعدات اللازمة لتنفيذ الخدمة.',items:[newItem({description:'الخدمة الأولى',qty:1,unit:'خدمة',price:0})]});queueSave();toast('تم إنشاء عرض جديد')}
    function downloadBlob(blob,fileName){const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=fileName;link.style.display='none';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
    async function exportPdf(){
      collect();
      if(!state.clientName.trim()){toast('اكتب اسم العميل داخل العرض أولًا');return}
      const button=$('#pdfBtn'),original=button.innerHTML,paper=$('#paper');
      button.disabled=true;button.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i><span>جاري التصدير</span>';
      try{
        await document.fonts.ready;
        await Promise.all([...paper.querySelectorAll('img')].map(image=>image.complete?Promise.resolve():image.decode()));
        const canvas=await html2canvas(paper,{
          scale:2,
          useCORS:true,
          backgroundColor:'#ffffff',
          width:794,
          height:1123,
          windowWidth:794,
          windowHeight:1123,
          scrollX:0,
          scrollY:0,
          onclone:documentClone=>{documentClone.querySelectorAll('.add-row,.remove-row').forEach(element=>element.style.display='none')}
        });
        const{jsPDF}=window.jspdf;
        const pdf=new jsPDF({orientation:'portrait',unit:'mm',format:'a4',compress:true,putOnlyUsedFonts:true});
        pdf.addImage(canvas.toDataURL('image/jpeg',.96),'JPEG',0,0,210,297,undefined,'FAST');
        downloadBlob(pdf.output('blob'),`Quotation-${state.quoteNumber}.pdf`);
        toast('تم تصدير صفحة عرض السعر');
      }catch(error){console.error(error);toast('تعذر تصدير PDF')}
      finally{button.disabled=false;button.innerHTML=original}
    }
    $$('[data-field]').forEach(element=>element.addEventListener('input',()=>{collect();queueSave()}));
    ['vatRate','discountValue'].forEach(id=>$('#'+id).addEventListener('input',()=>{collect();renderTotals();queueSave()}));
    $('#addItem').onclick=()=>{state.items.push(newItem());renderItems();queueSave()};$('#saveBtn').onclick=()=>saveQuote();$('#newBtn').onclick=newQuote;$('#savedBtn').onclick=()=>{renderSaved();$('#savedModal').classList.add('open')};$('#closeSaved').onclick=()=>$('#savedModal').classList.remove('open');$('#savedModal').onclick=event=>{if(event.target===$('#savedModal'))$('#savedModal').classList.remove('open')};$('#pdfBtn').onclick=exportPdf;$('#quickPdf').onclick=exportPdf;$('#printBtn').onclick=()=>window.print();
    $('#darkBtn').onclick=()=>{document.documentElement.classList.toggle('dark');const dark=document.documentElement.classList.contains('dark');$('#darkBtn i').className=dark?'fa-solid fa-sun':'fa-solid fa-moon';localStorage.setItem('swDark',dark?'1':'0')};if(localStorage.getItem('swDark')==='1'){document.documentElement.classList.add('dark');$('#darkBtn i').className='fa-solid fa-sun'}
    document.addEventListener('keydown',event=>{if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='s'){event.preventDefault();saveQuote()}if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='e'){event.preventDefault();exportPdf()}if(event.key==='Escape')$('#savedModal').classList.remove('open')});
    try{const draft=JSON.parse(localStorage.getItem(DRAFT)||'null');if(draft?.quoteNumber)applyState(draft);else applyState({...state,quoteNumber:nextNumber(),quoteDate:today(),expiryDate:plusDays(today(),15),items:[newItem({description:'اشتراك غسيل شهري',qty:1,unit:'باقة',price:0}),newItem({description:'خدمة إضافية',qty:1,unit:'خدمة',price:0})]})}catch(_){applyState({...state,quoteNumber:nextNumber(),quoteDate:today(),expiryDate:plusDays(today(),15),items:[newItem()]})}
  })();
  </script>
  <script src="./site-config.js?v=8"></script>
  <script src="./sweater-ui.js?v=6"></script>
</body>
</html>
