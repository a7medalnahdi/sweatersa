(()=>{'use strict';const $=id=>document.getElementById(id),fields=['firstName','lastName','jobTitle','department','employeeNo'];let face='front';const toast=m=>{const e=$('toast');e.textContent=m;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2200)};function sync(){ $('outFirst').textContent=$('firstName').value;$('outLast').textContent=$('lastName').value;$('outTitle').textContent=$('jobTitle').value;$('outDept').textContent=$('department').value;$('outNo').textContent=$('employeeNo').value;$('photoBox').style.setProperty('--ps',+$('photoScale').value/100);$('photoBox').style.setProperty('--py',$('photoY').value+'%');$('photoBox').classList.toggle('grayscale',$('grayscale').checked);$('scaleOut').textContent=$('photoScale').value+'%';$('yOut').textContent=$('photoY').value;makeQr()}function makeQr(){try{const qr=qrcode(0,'M');qr.addData($('qrUrl').value||'https://sweater.sa');qr.make();$('backQr').innerHTML=qr.createSvgTag({cellSize:4,margin:0,scalable:true})}catch(_){}}function fit(){const s=$('stage'),scale=Math.max(.28,Math.min(.68,(s.clientWidth-30)/640,(s.clientHeight-30)/1000));$('frontCard').style.transform=$('backCard').style.transform=`scale(${scale})`;$('cardWrap').style.width=640*scale+'px';$('cardWrap').style.height=1000*scale+'px'}function showFace(next){face=next;$('frontCard').classList.toggle('hidden-card',next!=='front');$('backCard').classList.toggle('hidden-card',next!=='back');document.querySelectorAll('[data-face]').forEach(b=>b.classList.toggle('active',b.dataset.face===next))}async function capture(el){await document.fonts.ready;const prev=el.style.transform;el.style.transform='none';el.classList.remove('hidden-card');const c=await html2canvas(el,{scale:2,useCORS:true,backgroundColor:'#fff'});el.style.transform=prev;if(el.id==='frontCard'&&face!=='front'||el.id==='backCard'&&face!=='back')el.classList.add('hidden-card');return c}function download(url,name){const a=document.createElement('a');a.href=url;a.download=name;a.click()}fields.forEach(k=>$(k).oninput=sync);['photoScale','photoY'].forEach(k=>$(k).oninput=sync);$('grayscale').onchange=sync;$('qrUrl').oninput=sync;$('photoInput').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('photo').src=r.result;$('photo').hidden=false;$('placeholder').hidden=true};r.readAsDataURL(f)};document.querySelectorAll('[data-face]').forEach(b=>b.onclick=()=>showFace(b.dataset.face));$('frontPng').onclick=async()=>{try{const el=face==='front'?$('frontCard'):$('backCard'),c=await capture(el);download(c.toDataURL('image/png'),`employee-card-${face}.png`);toast('تم تصدير الوجه الحالي')}catch(e){console.error(e);toast('تعذر التصدير')}};$('bothPdf').onclick=async()=>{try{const a=await capture($('frontCard')),b=await capture($('backCard')),{jsPDF}=window.jspdf,pdf=new jsPDF({orientation:'portrait',unit:'px',format:[640,1000]});pdf.addImage(a.toDataURL('image/png'),'PNG',0,0,640,1000);pdf.addPage([640,1000],'portrait');pdf.addImage(b.toDataURL('image/png'),'PNG',0,0,640,1000);pdf.save(`employee-card-${$('employeeNo').value||'new'}.pdf`);toast('تم تصدير الوجهين PDF')}catch(e){console.error(e);toast('تعذر التصدير')}};window.addEventListener('resize',fit);sync();showFace('front');setTimeout(fit,80)})();
