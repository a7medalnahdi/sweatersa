<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>كاتب المحتوى | SWEATER</title>
  <link rel="stylesheet" href="./sweater-ui.css?v=11"><link rel="stylesheet" href="./local-studio.css?v=6">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase-config.js?v=1"></script><script src="./supabase-app.js?v=3"></script><script src="./auth-gateway.js?v=3"></script>
  <style>
    @font-face{font-family:LamaSans;src:url('./fonts/LamaSans-Regular.woff2')}@font-face{font-family:LamaSans;src:url('./fonts/LamaSans-Bold.woff2');font-weight:700}@font-face{font-family:LamaSans;src:url('./fonts/LamaSans-ExtraBold.woff2');font-weight:800}
    :root{--orange:#f96714;--ink:#162033;--muted:#758197;--line:#e6eaf0;--soft:#f5f7fa}*{box-sizing:border-box}body{margin:0;background:#eef1f5;color:var(--ink);font-family:LamaSans,Arial,sans-serif}.top{height:68px;padding:0 20px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.brand,.head-actions{display:flex;align-items:center;gap:10px}.back,.icon-btn{width:40px;height:40px;border:1px solid var(--line);border-radius:11px;background:#fff;color:#64748b;display:grid;place-items:center;text-decoration:none}.brand-mark{width:42px;height:42px;border-radius:13px;background:#fff0e7;color:var(--orange);display:grid;place-items:center}.brand strong{display:block;font-size:13px}.brand small{display:block;margin-top:2px;color:var(--muted);font-size:8px}.shell{height:calc(100vh - 68px);padding:16px;display:grid;grid-template-columns:270px minmax(0,1fr);gap:14px}.side,.chat{background:#fff;border:1px solid var(--line);border-radius:19px;overflow:hidden}.side{display:flex;flex-direction:column}.new-chat{height:43px;margin:14px;border:0;border-radius:11px;background:var(--orange);color:#fff;font-weight:800;font-size:10px}.side-title{padding:0 15px 9px;color:var(--muted);font-size:8px;font-weight:800}.conversations{padding:0 9px 12px;overflow:auto}.conversation{width:100%;border:0;border-radius:10px;background:transparent;padding:10px;text-align:right;color:#475569;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.conversation:hover,.conversation.active{background:#fff3eb;color:#c2410c}.chat{display:flex;flex-direction:column;min-width:0}.chat-head{height:61px;padding:0 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.chat-head strong{font-size:11px}.status{display:flex;align-items:center;gap:6px;color:#059669;font-size:8px}.status::before{content:"";width:7px;height:7px;border-radius:50%;background:#10b981}.quick{padding:12px 16px;display:flex;gap:7px;overflow:auto;border-bottom:1px solid #f1f3f6}.quick button{white-space:nowrap;height:34px;padding:0 11px;border:1px solid var(--line);border-radius:9px;background:#fff;color:#526176;font-size:8px;font-weight:800}.quick button:hover{border-color:#fdba74;color:#c2410c;background:#fff7ed}.messages{flex:1;overflow:auto;padding:22px max(20px,8%);display:flex;flex-direction:column;gap:14px;background:linear-gradient(180deg,#fff,#fbfcfd)}.welcome{text-align:center;margin:auto;max-width:500px}.welcome i{width:66px;height:66px;border-radius:20px;background:#fff0e7;color:var(--orange);display:grid;place-items:center;margin:auto;font-size:25px}.welcome h1{font-size:19px;margin:16px 0 7px}.welcome p{font-size:10px;line-height:1.8;color:var(--muted);margin:0}.msg{max-width:min(720px,88%);padding:13px 15px;border-radius:15px;font-size:11px;line-height:1.85;white-space:pre-wrap}.msg.user{align-self:flex-start;background:#172033;color:#fff;border-bottom-left-radius:4px}.msg.assistant{align-self:flex-end;background:#fff3eb;color:#3c4657;border:1px solid #fed7aa;border-bottom-right-radius:4px}.msg .copy{display:block;margin-top:8px;border:0;background:transparent;color:inherit;opacity:.65;font-size:8px}.composer{padding:13px 16px;border-top:1px solid var(--line);background:#fff}.compose-box{max-width:920px;margin:auto;display:flex;align-items:flex-end;gap:9px;padding:8px;border:1px solid var(--line);border-radius:15px;background:#fafbfc}.compose-box:focus-within{border-color:#fdba74;box-shadow:0 0 0 3px #fff1e8}.compose-box textarea{flex:1;min-height:39px;max-height:130px;padding:9px;border:0;outline:0;resize:none;background:transparent;font:10px LamaSans;color:var(--ink)}.send{width:42px;height:42px;flex:0 0 auto;border:0;border-radius:11px;background:var(--orange);color:#fff}.send:disabled{opacity:.45}.hint{text-align:center;color:#94a3b8;font-size:7px;margin-top:6px}.setup{margin:auto;padding:15px;border:1px solid #fde68a;border-radius:13px;background:#fffbeb;color:#92400e;font-size:10px;line-height:1.8}@media(max-width:760px){.shell{grid-template-columns:1fr;height:auto;min-height:calc(100vh - 68px)}.side{display:none}.chat{min-height:calc(100vh - 100px)}.messages{padding:18px 12px}.brand small{display:none}}
  </style>
</head>
<body>
  <header class="top"><div class="brand"><a class="back" href="./index.html"><i class="fa-solid fa-arrow-right"></i></a><span class="brand-mark"><i class="fa-solid fa-pen-nib"></i></span><div><strong>كاتب المحتوى</strong><small>مساعد سويتر لكتابة محتوى جاهز</small></div></div><div class="head-actions"><button class="icon-btn" id="refreshBtn" title="تحديث"><i class="fa-solid fa-rotate"></i></button></div></header>
  <main class="shell">
    <aside class="side"><button class="new-chat" id="newChat"><i class="fa-solid fa-plus"></i> محادثة جديدة</button><div class="side-title">المحادثات السابقة</div><div class="conversations" id="conversations"></div></aside>
    <section class="chat">
      <div class="chat-head"><strong id="chatTitle">محادثة جديدة</strong><span class="status">جاهز للكتابة</span></div>
      <div class="quick"><button data-prompt="اكتب لي منشوراً لمنصات التواصل عن: ">منشور اجتماعي</button><button data-prompt="اكتب إشعاراً قصيراً للعملاء عن: ">إشعار للعملاء</button><button data-prompt="اكتب رسالة واتساب احترافية عن: ">رسالة واتساب</button><button data-prompt="اقترح عناوين إعلانية جذابة عن: ">عناوين إعلانية</button><button data-prompt="أعد صياغة النص التالي بأسلوب سويتر: ">إعادة صياغة</button></div>
      <div class="messages" id="messages"><div class="welcome" id="welcome"><i class="fa-solid fa-wand-magic-sparkles"></i><h1>وش نكتب اليوم؟</h1><p>اشرح المطلوب بطريقتك، وسيجهز لك الكاتب محتوى مرتبًا ومتوافقًا مع أسلوب سويتر.</p></div></div>
      <div class="composer"><div class="compose-box"><textarea id="input" placeholder="اكتب طلبك هنا..." rows="1"></textarea><button class="send" id="sendBtn" aria-label="إرسال"><i class="fa-solid fa-arrow-up"></i></button></div><div class="hint">راجع المحتوى قبل نشره أو إرساله للعملاء</div></div>
    </section>
  </main>
  <script>
  (()=>{'use strict';const $=id=>document.getElementById(id),client=window.SweaterCloud?.client;let activeId=null,busy=false;
    const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const setBusy=v=>{busy=v;$('sendBtn').disabled=v;$('sendBtn').innerHTML=v?'<i class="fa-solid fa-spinner fa-spin"></i>':'<i class="fa-solid fa-arrow-up"></i>'};
    function message(role,text){$('welcome')?.remove();const div=document.createElement('div');div.className='msg '+role;div.innerHTML=`${escape(text)}${role==='assistant'?'<button class="copy"><i class="fa-regular fa-copy"></i> نسخ</button>':''}`;div.querySelector('.copy')?.addEventListener('click',()=>navigator.clipboard.writeText(text));$('messages').append(div);$('messages').scrollTop=$('messages').scrollHeight}
    async function conversations(){const {data}=await client.from('writer_conversations').select('id,title').order('updated_at',{ascending:false}).limit(50);$('conversations').innerHTML=(data||[]).map(x=>`<button class="conversation ${x.id===activeId?'active':''}" data-id="${x.id}">${escape(x.title)}</button>`).join('');$('conversations').querySelectorAll('button').forEach(b=>b.onclick=()=>load(b.dataset.id,b.textContent))}
    async function load(id,title){activeId=id;$('chatTitle').textContent=title;$('messages').innerHTML='';const {data}=await client.from('writer_messages').select('role,content').eq('conversation_id',id).order('created_at');(data||[]).forEach(x=>message(x.role,x.content));await conversations()}
    function reset(){activeId=null;$('chatTitle').textContent='محادثة جديدة';$('messages').innerHTML='<div class="welcome" id="welcome"><i class="fa-solid fa-wand-magic-sparkles"></i><h1>وش نكتب اليوم؟</h1><p>اشرح المطلوب بطريقتك، وسيجهز لك الكاتب محتوى مرتبًا ومتوافقًا مع أسلوب سويتر.</p></div>';conversations()}
    async function send(){const text=$('input').value.trim();if(!text||busy)return;$('input').value='';message('user',text);setBusy(true);try{const {data,error}=await client.functions.invoke('content-writer',{body:{conversationId:activeId,message:text}});if(data?.conversationId)activeId=data.conversationId;if(error||data?.error){const note=data?.error||error?.message||'تعذر إرسال الطلب';message('assistant',note)}else message('assistant',data.answer);await conversations()}catch(e){message('assistant','تعذر الاتصال بكاتب المحتوى. حاول مرة أخرى.')}finally{setBusy(false)}}
    $('sendBtn').onclick=send;$('input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};$('newChat').onclick=reset;$('refreshBtn').onclick=()=>activeId?load(activeId,$('chatTitle').textContent):conversations();document.querySelectorAll('[data-prompt]').forEach(b=>b.onclick=()=>{$('input').value=b.dataset.prompt;$('input').focus()});
    (async()=>{if(!client)return;const {data}=await client.auth.getUser();if(!data.user)return;await conversations()})();
  })();
  </script><script src="./site-config.js?v=17"></script><script src="./sweater-ui.js?v=9"></script>
</body></html>
