status{margin-top:9px;color:#667085;font-size:11px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{margin-bottom:10px}.field label{display:block;margin-bottom:6px;color:#667085;font-size:11px;font-weight:800}.field input{width:100%;height:44px;padding:0 11px;border:1px solid var(--line);border-radius:10px;outline:0}.field input:focus{border-color:var(--a);box-shadow:0 0 0 3px #f9671418}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.photo{position:relative;aspect-ratio:1;border:1px dashed #d0d5dd;border-radius:13px;display:grid;place-items:center;overflow:hidden;background:#f9fafb;color:#98a2b3;text-align:center;font-size:10px;cursor:pointer}.photo input{display:none}.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.photo span{position:relative;z-index:1;padding:5px 7px;border-radius:7px;background:#ffffffe8}.preview{min-width:0;padding:20px;display:flex;flex-direction:column;align-items:center}.preview-top{width:100%;display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:15px}.preview-top h2{margin:0;font-size:16px}.pages{display:flex;gap:5px}.pages button{width:34px;height:34px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:11px;font-weight:900}.pages button.active{border-color:var(--a);background:var(--a);color:#fff}.stage{width:min(640px,100%);aspect-ratio:2/3;padding:12px;border-radius:18px;background:#eef0f3;display:grid;place-items:center}.stage canvas{display:block;width:100%;height:100%;object-fit:contain;border-radius:9px;background:#f96714;box-shadow:0 16px 45px #1018281c}.actions{display:flex;gap:8px;margin-top:15px;flex-wrap:wrap;justify-content:center}.data-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.data-summary div{padding:9px;border-radius:10px;background:#f8fafc;text-align:center}.data-summary strong,.data-summary span{display:block}.data-summary strong{font-size:15px}.data-summary span{margin-top:3px;color:#98a2b3;font-size:9px}.toast{position:fixed;left:18px;bottom:18px;padding:12px 15px;border-radius:11px;background:#111;color:#fff;font-size:12px;opacity:0;transform:translateY(8px);transition:.2s}.toast.show{opacity:1;transform:none}@media(max-width:900px){.workspace{grid-template-columns:1fr}.stage{width:min(560px,100%)}}@media(max-width:520px){.head{padding:0 12px}.brand span{display:none}.workspace{padding:10px}.panel,.preview{border-radius:16px}.row{grid-template-columns:1fr}.preview-top{align-items:flex-start;flex-direction:column}.stage{padding:7px}}
</style></head><body><header class="head"><div class="brand"><a class="back" href="./index.html"><i class="fa-solid fa-arrow-right"></i></a><div class="mark"><i class="fa-solid fa-trophy"></i></div><div><strong>صانع تصاميم أفضل 50</strong><span>استيراد البيانات وتصدير الصفحات تلقائيًا</span></div></div><div class="head-side"></div></header><main class="workspace"><aside class="panel"><section class="step"><h2><b>1</b>بيانات الفائزين</h2><label class="drop"><input id="sheetFile" type="file" accept=".xlsx,.xls,.csv,.tsv"><i class="fa-solid fa-file-excel"></i><strong>ارفع ملف Excel أو TSV</strong><span>Biker's Name · Place · $ · Rating</span></label><div class="status" id="fileStatus">لم يتم رفع ملف بعد.</div><div class="data-summary"><div><strong id="rowCount">0</strong><span>سجل</span></div><div><strong id="topRating">—</strong><span>أعلى تقييم</span></div><div><strong id="totalPrize">0</strong><span>إجمالي الجوائز</span></div></div></section><section class="step"><h2><b>2</b>بيانات التصميم</h2><div class="row"><div class="field"><label>الشهر</label><input id="month" value="June"></div><div class="field"><label>السنة</label><input id="year" value="2026"></div></div><div class="field"><label>العنوان الرئيسي</label><input id="title" value="TOP 50"></div></section><section class="step"><h2><b>3</b>صور المراكز الثلاثة</h2><div class="photos"><label class="photo"><input data-photo="1" type="file" accept="image/*"><span>المركز الأول</span><img hidden></label><label class="photo"><input data-photo="2" type="file" accept="image/*"><span>المركز الثاني</span><img hidden></label><label class="photo"><input data-photo="3" type="file" accept="image/*"><span>المركز الثالث</span><img hidden></label></div><p class="status">يفضل PNG بخلفية شفافة. بقية المراكز لا تحتاج صورًا.</p></section></aside><section class="preview"><div class="preview-top"><div><h2>معاينة الصفحات</h2><span class="status">المقاس النهائي 2000 × 3000</span></div><div class="pages" id="pages"></div></div><div class="stage"><canvas id="canvas" width="2000" height="3000"></canvas></div><div class="actions"><button class="btn primary" id="downloadPage"><i class="fa-solid fa-download"></i> تنزيل الصفحة</button><button class="btn" id="downloadAll"><i class="fa-solid fa-file-zipper"></i> تنزيل الخمس صفحات ZIP</button></div></section></main><div class="toast" id="toast"></div><script>
(()=>{'use strict';const $=s=>document.querySelector(s),canvas=$('#canvas'),ctx=canvas.getContext('2d'),photos={},SAMPLE=[];let rows=SAMPLE,page=1;const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)};const norm=s=>String(s||'').trim().toLowerCase().replace(/[^a-z0-9$]/g,'');const pick=(headers,names)=>{const ns=headers.map(norm);for(const n of names){const i=ns.indexOf(norm(n));if(i>-1)return i}return-1};const parse=async file=>{const buf=await file.arrayBuffer(),wb=XLSX.read(buf,{type:'array'}),raw=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});if(raw.length<2)throw Error('الملف لا يحتوي بيانات');const h=raw[0],ni=pick(h,["Biker's Name",'name','employee']),pi=pick(h,['Place','rank','position']),mi=pick(h,['$','prize','reward']),ri=pick(h,['Rating','rate']);if([ni,pi,mi,ri].some(i=>i<0))throw Error('لم أجد الأعمدة المطلوبة');return raw.slice(1).filter(r=>r[ni]!==''&&r[pi]!=='').map(r=>({name:String(r[ni]).trim(),place:Number(r[pi]),prize:Number(r[mi])||0,rating:Number(r[ri])||0})).sort((a,b)=>a.place-b.place)};const updateSummary=()=>{$('#rowCount').textContent=rows.length;$('#topRating').textContent=rows.length?Math.max(...rows.map(r=>r.rating)).toFixed(2):'—';$('#totalPrize').textContent=rows.reduce((s,r)=>s+r.prize,0).toLocaleString('en-US')};$('#sheetFile').onchange=async e=>{try{rows=await parse(e.target.files[0]);$('#fileStatus').textContent=`تمت قراءة ${rows.length} سجل بنجاح.`;updateSummary();draw();toast('تم استيراد البيانات')}catch(err){$('#fileStatus').textContent=err.message;toast(err.message)}};document.querySelectorAll('[data-photo]').forEach(input=>input.onchange=async()=>{const n=Number(input.dataset.photo),url=URL.createObjectURL(input.files[0]),img=new Image();img.onload=()=>{photos[n]=img;const p=input.parentElement.querySelector('img');p.src=url;p.hidden=false;draw()};img.src=url});['month','year','title'].forEach(id=>$('#'+id).oninput=draw);const pages=$('#pages');for(let i=1;i<=5;i++){const b=document.createElement('button');b.textContent=i;b.onclick=()=>{page=i;draw()};pages.append(b)};const round=(x,y,w,h,r)=>{ctx.beginPath();ctx.roundRect(x,y,w,h,r)};const fit=(text,max,size,min=30)=>{ctx.font=`400 ${size}px LamaSans`;while(ctx.measureText(text).width>max&&size>min){size-=2;ctx.font=`400 ${size}px LamaSans`}return size};const bg=()=>{const g=ctx.createRadialGradient(1000,400,50,1000,1500,1800);g.addColorStop(0,'#ff884b');g.addColorStop(1,'#f96714');ctx.fillStyle=g;ctx.fillRect(0,0,2000,3000);ctx.save();ctx.globalAlpha=.1;ctx.strokeStyle='#fff';ctx.lineWidth=70;ctx.beginPath();ctx.arc(1000,1850,650,0,Math.PI*2);ctx.stroke();ctx.restore();ctx.fillStyle='#ffffff10';ctx.font='900 1300px LamaSans';ctx.textAlign='center';ctx.fillText('Y',1000,2350)};const head=()=>{ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='900 250px LamaSans';ctx.fillText($('#title').value||'TOP 50',1000,260);ctx.font='400 78px LamaSans';ctx.fillText(`in ${$('#month').value} ${$('#year').value}! - Congratulations`,1000,390)};const cover=()=>{bg();ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='900 190px LamaSans';ctx.fillText('Best 3 bikers',1000,380);ctx.font='400 88px LamaSans';ctx.fillText(`in ${$('#month').value} ${$('#year').value}!`,1000,560);const order=[2,1,3],xs=[180,690,1200],ys=[980,850,1000];order.forEach((rank,i)=>{const r=rows.find(x=>x.place===rank)||{name:`Winner ${rank}`,prize:0,rating:0};if(photos[rank]){const im=photos[rank],ratio=Math.min(620/im.width,1120/im.height),w=im.width*ratio,h=im.height*ratio;ctx.drawImage(im,xs[i]+(620-w)/2,ys[i]+1120-h,w,h)}ctx.fillStyle='#ffffffb8';round(xs[i],2050,620,720,55);ctx.fill();ctx.fillStyle=rank===1?'#eab308':rank===2?'#cbd5e1':'#c56a38';ctx.beginPath();ctx.arc(xs[i]+310,2070,105,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='900 90px LamaSans';ctx.fillText(String(rank),xs[i]+310,2100);ctx.fillStyle='#fff';ctx.font='900 125px LamaSans';ctx.fillText(String(r.name.match(/\((\d+)\)/)?.[1]||r.place),xs[i]+310,2350);ctx.font=`900 ${fit(r.name.replace(/\s*\(\d+\)\s*/,''),530,48,28)}px LamaSans`;ctx.fillText(r.name.replace(/\s*\(\d+\)\s*/,''),xs[i]+310,2460);ctx.font='900 75px LamaSans';ctx.fillText(`SAR ${r.prize}`,xs[i]+310,2600);ctx.font='900 40px LamaSans';ctx.fillText(`Rating: ${r.rating.toFixed(2)}`,xs[i]+310,2700)})};const list=()=>{bg();head();const start=3+(page-2)*12,end=Math.min(start+12,rows.length),data=rows.slice(start,end);data.forEach((r,i)=>{const y=500+i*195;ctx.fillStyle='#ffffffc7';round(190,y,1620,165,82);ctx.fill();ctx.textBaseline='middle';ctx.textAlign='left';ctx.fillStyle='#f96714';ctx.font='900 68px LamaSans';ctx.fillText(`${r.place}-`,235,y+82);ctx.fillStyle='#111';ctx.font=`400 ${fit(r.name,790,57,34)}px LamaSans`;ctx.fillText(r.name,390,y+82);ctx.textAlign='right';ctx.font='900 55px LamaSans';ctx.fillText(r.rating.toFixed(2),1430,y+82);ctx.fillStyle='#f96714';ctx.font='900 82px LamaSans';ctx.fillText(`SAR ${r.prize}`,1750,y+82);ctx.textBaseline='alphabetic'})};function draw(){document.querySelectorAll('#pages button').forEach((b,i)=>b.classList.toggle('active',i+1===page));page===1?cover():list()}const blob=()=>new Promise(r=>canvas.toBlob(r,'image/png',1));const save=(b,n)=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('#downloadPage').onclick=async()=>save(await blob(),`best-50-page-${page}.png`);$('#downloadAll').onclick=async()=>{if(!rows.length)return toast('ارفع ملف البيانات أولًا');const zip=new JSZip(),old=page;for(let i=1;i<=5;i++){page=i;draw();zip.file(`best-50-page-${i}.png`,await blob())}page=old;draw();save(await zip.generateAsync({type:'blob'}),`best-50-${$('#month').value}-${$('#year').value}.zip`);toast('تم تجهيز الصفحات الخمس')};updateSummary();draw()})();
</script><script src="./top50-render-v2.js?v=2"></script><link rel="stylesheet" href="./top50-ui-v2.css?v=1"><script src="./site-config.js?v=28"></script><script src="./sweater-ui.js?v=10"></script></body></html>
