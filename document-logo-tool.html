<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>إضافة شعار للملفات | SWEATER</title>
  <meta name="description" content="إضافة شعار إلى جميع صفحات PDF أو شرائح PowerPoint وتصدير الملف كاملاً.">
  <link rel="stylesheet" href="./sweater-ui.css?v=8"><link rel="stylesheet" href="./local-studio.css?v=6">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <style>
    :root{--a:#f96714;--purple:#7c3aed;--ink:#172033;--muted:#718096;--line:#e5e9ef;--soft:#f5f7fa}*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:var(--ink);font-family:LamaSans,sans-serif}button,input,select{font:inherit}.tool-head{height:68px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.94);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;backdrop-filter:blur(16px)}.brand,.head-side{display:flex;align-items:center;gap:10px}.back{width:40px;height:40px;display:grid;place-items:center;border-radius:11px;background:#f1f5f9;color:#64748b;text-decoration:none}.brand-mark{width:41px;height:41px;border-radius:12px;display:grid;place-items:center;background:#f3e8ff;color:var(--purple);font-size:17px}.brand strong{display:block;font-size:13px}.brand span{display:block;color:var(--muted);font-size:8px;margin-top:3px}.workspace{max-width:1260px;margin:auto;padding:20px;display:grid;grid-template-columns:350px minmax(0,1fr);gap:18px}.panel,.preview{background:#fff;border:1px solid var(--line);border-radius:19px}.panel{padding:17px;align-self:start;position:sticky;top:88px}.step{display:flex;align-items:center;gap:9px;margin:0 0 11px;font-size:10px}.step b{width:25px;height:25px;display:grid;place-items:center;border-radius:8px;background:#fff1e8;color:#c2410c}.upload{min-height:130px;border:2px dashed #d8dee7;border-radius:14px;background:#fafbfc;display:grid;place-items:center;text-align:center;padding:16px;cursor:pointer;transition:.2s}.upload:hover,.upload.drag{border-color:#fb923c;background:#fff7ed}.upload i{display:block;color:var(--a);font-size:25px;margin-bottom:9px}.upload strong{display:block;font-size:10px}.upload span{display:block;color:var(--muted);font-size:8px;margin-top:6px}.file-info{display:none;margin-top:9px;padding:10px;border-radius:10px;background:#f8fafc}.file-info.show{display:flex;align-items:center;gap:9px}.file-info i{color:var(--purple)}.file-info div{min-width:0;flex:1}.file-info strong,.file-info span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.file-info strong{font-size:9px}.file-info span{font-size:7px;color:var(--muted);margin-top:3px}.divider{height:1px;background:var(--line);margin:17px 0}.logo-box{display:flex;align-items:center;gap:8px}.logo-box input{min-width:0;flex:1;height:40px;padding:8px;border:1px solid var(--line);border-radius:9px;font-size:8px}.logo-thumb{width:48px;height:40px;border:1px solid var(--line);border-radius:9px;object-fit:contain;background:#fff}.field{margin-top:13px}.field label{display:flex;justify-content:space-between;margin-bottom:7px;color:#536176;font-size:8px;font-weight:900}.field input[type=range]{width:100%;accent-color:var(--a)}.positions{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.pos{height:34px;border:1px solid var(--line);border-radius:8px;background:#fff;color:#94a3b8}.pos.active{border-color:#fb923c;background:#fff7ed;color:#c2410c}.drag-hint{margin-top:9px;padding:9px 10px;border-radius:9px;background:#fff7ed;color:#c2410c;font-size:8px;font-weight:800;text-align:center}.export{width:100%;height:45px;margin-top:16px;border:0;border-radius:11px;background:var(--a);color:#fff;font-size:9px;font-weight:900}.export:disabled{opacity:.45}.preview{min-height:680px;padding:20px;display:flex;flex-direction:column}.preview-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.preview-head h2{font-size:13px;margin:0}.preview-head span{font-size:8px;color:var(--muted)}.stage-wrap{flex:1;min-height:570px;border-radius:15px;background:#e9edf2;display:grid;place-items:center;padding:25px;overflow:auto}.empty{color:#94a3b8;text-align:center}.empty i{display:block;font-size:44px;margin-bottom:13px}.empty strong{display:block;color:#64748b;font-size:11px}.empty span{display:block;font-size:8px;margin-top:7px}.page{position:relative;max-width:100%;max-height:540px;background:#fff;box-shadow:0 18px 55px rgba(15,23,42,.16);overflow:hidden}.page canvas,.page .ppt-cover{display:block;max-width:100%;max-height:540px}.ppt-cover{width:760px;aspect-ratio:16/9;position:relative;background:linear-gradient(135deg,#fff,#f4f0ff);display:grid!important;place-items:center;color:#7c3aed;text-align:center}.ppt-cover img{width:100%;height:100%;object-fit:contain}.ppt-fallback i{font-size:54px}.ppt-fallback strong{display:block;margin-top:15px;font-size:17px}.ppt-fallback span{display:block;margin-top:6px;color:#718096;font-size:9px}.logo-overlay{position:absolute;left:85%;top:85%;width:18%;transform:translate(-50%,-50%);object-fit:contain;opacity:1;pointer-events:auto;cursor:grab;touch-action:none;user-select:none;border:1px dashed transparent;border-radius:4px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.08))}.logo-overlay:hover,.logo-overlay.dragging{border-color:var(--a);filter:drop-shadow(0 4px 8px rgba(249,103,20,.25))}.logo-overlay.dragging{cursor:grabbing}.notice{margin-top:12px;padding:10px 12px;border-radius:10px;background:#f8fafc;color:#64748b;font-size:8px;line-height:1.7}.progress{display:none;margin-top:12px}.progress.show{display:block}.progress-track{height:6px;border-radius:99px;background:#e5e7eb;overflow:hidden}.progress-bar{height:100%;width:0;background:var(--a);transition:.2s}.progress span{display:block;margin-top:6px;color:var(--muted);font-size:8px}.toast{position:fixed;left:18px;bottom:18px;z-index:100;padding:11px 14px;border-radius:10px;background:#111827;color:#fff;font-size:9px;font-weight:800;opacity:0;transform:translateY(8px);transition:.2s}.toast.show{opacity:1;transform:none}.dark body{background:#090d15;color:#f8fafc}.dark .tool-head,.dark .panel,.dark .preview,.dark .pos{background:#111827;border-color:#293548}.dark .upload,.dark .file-info,.dark .notice{background:#172033;border-color:#334155}.dark .stage-wrap{background:#0b1220}.dark .back{background:#1e293b}@media(max-width:900px){.workspace{grid-template-columns:1fr}.panel{position:static}.preview{min-height:auto}.stage-wrap{min-height:430px}}@media(max-width:520px){.tool-head{padding:0 12px}.brand span{display:none}.workspace{padding:12px}.panel,.preview{border-radius:15px}.stage-wrap{padding:12px;min-height:380px}}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-config.js?v=1"></script><script src="./supabase-app.js?v=2"></script><script src="./auth-gateway.js?v=2"></script>
</head>
<body>
  <header class="tool-head"><div class="brand"><a class="back" href="./index.html"><i class="fa-solid fa-arrow-right"></i></a><div class="brand-mark"><i class="fa-solid fa-stamp"></i></div><div><strong>إضافة شعار للملفات</strong><span>PDF وPowerPoint</span></div></div><div class="head-side"><button class="pos" id="themeBtn" title="تبديل المظهر"><i class="fa-solid fa-moon"></i></button></div></header>
  <main class="workspace">
    <aside class="panel">
      <h2 class="step"><b>1</b> ارفع الملف</h2>
      <label class="upload" id="fileDrop"><input id="fileInput" type="file" accept=".pdf,.pptx,application/pdf,application/vnd.openxmlformats-officedocument.presentationml.presentation" hidden><div><i class="fa-solid fa-cloud-arrow-up"></i><strong>اختر PDF أو PowerPoint</strong><span>PDF أو PPTX — حتى 50 MB</span></div></label>
      <div class="file-info" id="fileInfo"><i class="fa-solid fa-file"></i><div><strong id="fileName"></strong><span id="fileMeta"></span></div><button class="pos" id="removeFile"><i class="fa-solid fa-xmark"></i></button></div>
      <div class="divider"></div>
      <h2 class="step"><b>2</b> أضف الشعار</h2>
      <div class="logo-box"><img class="logo-thumb" id="logoThumb" alt=""><input id="logoInput" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml"></div>
      <div class="field"><label><span>حجم الشعار</span><span id="sizeValue">18%</span></label><input id="logoSize" type="range" min="5" max="40" value="18"></div>
      <div class="field"><label><span>الشفافية</span><span id="opacityValue">100%</span></label><input id="logoOpacity" type="range" min="15" max="100" value="100"></div>
      <div class="field"><label><span>موضع سريع</span></label><div class="positions" id="positions"><button class="pos" data-pos="15,15">أعلى يمين</button><button class="pos" data-pos="50,15">أعلى وسط</button><button class="pos" data-pos="85,15">أعلى يسار</button><button class="pos" data-pos="15,50">وسط يمين</button><button class="pos" data-pos="50,50">الوسط</button><button class="pos" data-pos="85,50">وسط يسار</button><button class="pos" data-pos="15,85">أسفل يمين</button><button class="pos" data-pos="50,85">أسفل وسط</button><button class="pos active" data-pos="85,85">أسفل يسار</button></div><div class="drag-hint"><i class="fa-solid fa-hand-pointer"></i> اسحب الشعار فوق الغلاف وضعه في أي مكان</div></div>
      <button class="export" id="exportBtn" disabled><i class="fa-solid fa-download"></i> تصدير الملف — الشعار على الغلاف فقط</button>
      <div class="progress" id="progress"><div class="progress-track"><div class="progress-bar" id="progressBar"></div></div><span id="progressText">جارٍ المعالجة…</span></div>
      <div class="notice"><i class="fa-solid fa-shield-halved"></i> تتم معالجة الملف داخل جهازك ولا يتم رفع محتواه إلى الخادم.</div>
    </aside>
    <section class="preview"><div class="preview-head"><h2>معاينة الغلاف</h2><span id="pageCount">لم يتم رفع ملف</span></div><div class="stage-wrap" id="stage"><div class="empty"><i class="fa-regular fa-file-lines"></i><strong>ارفع ملفك للبدء</strong><span>ستظهر الصفحة الأولى أو صورة غلاف العرض هنا.</span></div></div></section>
  </main>
  <div class="toast" id="toast"></div>
  <script>
  (()=>{'use strict';
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
    let file=null,fileBytes=null,fileType='',logoData='',logoBytes=null,logoRatio=1,x=85,y=85;
    const toast=m=>{const e=$('#toast');e.textContent=m;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2400)};
    const progress=(value,text)=>{$('#progress').classList.toggle('show',value<100);$('#progressBar').style.width=value+'%';$('#progressText').textContent=text||'جارٍ المعالجة…'};
    const download=(bytes,name,type)=>{const blob=bytes instanceof Blob?bytes:new Blob([bytes],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1800)};
    const clearPositionPreset=()=>$$('.pos').filter(p=>p.dataset.pos).forEach(p=>p.classList.remove('active'));
    const syncOverlay=()=>{const logo=$('.logo-overlay');if(!logo)return;logo.style.left=x+'%';logo.style.top=y+'%';logo.style.width=$('#logoSize').value+'%';logo.style.opacity=$('#logoOpacity').value/100};
    const enableLogoDrag=()=>{
      const logo=$('.logo-overlay'),page=$('.page');if(!logo||!page)return;
      logo.addEventListener('pointerdown',event=>{if(!logo.src)return;event.preventDefault();logo.setPointerCapture(event.pointerId);logo.classList.add('dragging')});
      logo.addEventListener('pointermove',event=>{if(!logo.hasPointerCapture(event.pointerId))return;const rect=page.getBoundingClientRect(),halfX=logo.offsetWidth/rect.width*50,halfY=logo.offsetHeight/rect.height*50;x=Math.max(halfX,Math.min(100-halfX,(event.clientX-rect.left)/rect.width*100));y=Math.max(halfY,Math.min(100-halfY,(event.clientY-rect.top)/rect.height*100));clearPositionPreset();syncOverlay()});
      const stop=event=>{if(logo.hasPointerCapture(event.pointerId))logo.releasePointerCapture(event.pointerId);logo.classList.remove('dragging')};logo.addEventListener('pointerup',stop);logo.addEventListener('pointercancel',stop);
    };
    const updateReady=()=>{$('#exportBtn').disabled=!(file&&logoBytes)};
    async function normalizeLogo(source){
      const url=URL.createObjectURL(source),img=new Image();await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url});logoRatio=img.naturalWidth/img.naturalHeight;
      const canvas=document.createElement('canvas'),max=1600,scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));canvas.width=Math.max(1,img.naturalWidth*scale);canvas.height=Math.max(1,img.naturalHeight*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);URL.revokeObjectURL(url);
      const blob=await new Promise(res=>canvas.toBlob(res,'image/png'));logoBytes=new Uint8Array(await blob.arrayBuffer());logoData=canvas.toDataURL('image/png');$('#logoThumb').src=logoData;const overlay=$('.logo-overlay');if(overlay)overlay.src=logoData;syncOverlay();updateReady();
    }
    async function loadPdf(){
      const pdf=await pdfjsLib.getDocument({data:fileBytes.slice()}).promise,page=await pdf.getPage(1),viewport=page.getViewport({scale:1.35}),canvas=document.createElement('canvas');canvas.width=viewport.width;canvas.height=viewport.height;await page.render({canvasContext:canvas.getContext('2d'),viewport}).promise;
      const holder=document.createElement('div');holder.className='page';holder.append(canvas);const logo=document.createElement('img');logo.className='logo-overlay';logo.draggable=false;if(logoData)logo.src=logoData;holder.append(logo);$('#stage').replaceChildren(holder);$('#pageCount').textContent=`${pdf.numPages} صفحة · الشعار على الأولى فقط`;syncOverlay();enableLogoDrag();
    }
    async function loadPptx(){
      const zip=await JSZip.loadAsync(fileBytes),thumbName=Object.keys(zip.files).find(name=>/^docProps\/thumbnail\.(jpeg|jpg|png)$/i.test(name)),slides=Object.keys(zip.files).filter(name=>/^ppt\/slides\/slide\d+\.xml$/i.test(name)).length,cover=document.createElement('div');cover.className='page';const inner=document.createElement('div');inner.className='ppt-cover';
      if(thumbName){const blob=await zip.file(thumbName).async('blob'),url=URL.createObjectURL(blob),img=document.createElement('img');img.src=url;inner.append(img)}else inner.innerHTML=`<div class="ppt-fallback"><i class="fa-regular fa-file-powerpoint"></i><strong>${file.name.replace(/[<>&]/g,'')}</strong><span>معاينة غلاف PowerPoint</span></div>`;
      cover.append(inner);const logo=document.createElement('img');logo.className='logo-overlay';logo.draggable=false;if(logoData)logo.src=logoData;cover.append(logo);$('#stage').replaceChildren(cover);$('#pageCount').textContent=`${slides} شريحة · الشعار على الغلاف فقط`;syncOverlay();enableLogoDrag();
    }
    async function useFile(selected){
      if(!selected)return;if(selected.size>50*1024*1024)return toast('حجم الملف يتجاوز 50 MB');const ext=selected.name.split('.').pop().toLowerCase();if(!['pdf','pptx'].includes(ext))return toast('الصيغة المدعومة PDF أو PPTX');
      file=selected;fileType=ext;fileBytes=new Uint8Array(await selected.arrayBuffer());$('#fileName').textContent=selected.name;$('#fileMeta').textContent=`${(selected.size/1024/1024).toFixed(2)} MB · ${ext.toUpperCase()}`;$('#fileInfo').classList.add('show');progress(20,'جارٍ تجهيز الغلاف…');
      try{if(ext==='pdf')await loadPdf();else await loadPptx();progress(100);updateReady()}catch(error){console.error(error);toast('تعذر قراءة الملف');removeFile()}
    }
    function removeFile(){file=null;fileBytes=null;fileType='';$('#fileInput').value='';$('#fileInfo').classList.remove('show');$('#stage').innerHTML='<div class="empty"><i class="fa-regular fa-file-lines"></i><strong>ارفع ملفك للبدء</strong><span>ستظهر الصفحة الأولى أو صورة غلاف العرض هنا.</span></div>';$('#pageCount').textContent='لم يتم رفع ملف';updateReady()}
    async function exportPdf(){
      const doc=await PDFLib.PDFDocument.load(fileBytes),image=await doc.embedPng(logoBytes),page=doc.getPages()[0],sizePct=+$('#logoSize').value/100,opacity=+$('#logoOpacity').value/100;
      const {width,height}=page.getSize(),w=width*sizePct,h=w/logoRatio,left=Math.max(0,Math.min(width-w,width*x/100-w/2)),bottom=Math.max(0,Math.min(height-h,height*(1-y/100)-h/2));page.drawImage(image,{x:left,y:bottom,width:w,height:h,opacity});progress(90,'إضافة الشعار إلى صفحة الغلاف');
      return doc.save();
    }
    const nextRid=xml=>{const ids=[...xml.matchAll(/Id="rId(\d+)"/g)].map(m=>+m[1]);return `rId${Math.max(0,...ids)+1}`};
    async function exportPptx(){
      const zip=await JSZip.loadAsync(fileBytes),media='ppt/media/sweater-logo.png';zip.file(media,logoBytes);
      let types=await zip.file('[Content_Types].xml').async('text');if(!types.includes('Extension="png"'))types=types.replace('</Types>','<Default Extension="png" ContentType="image/png"/></Types>');zip.file('[Content_Types].xml',types);
      const pres=await zip.file('ppt/presentation.xml').async('text'),m=pres.match(/<p:sldSz[^>]*cx="(\d+)"[^>]*cy="(\d+)"/),cx=+(m?.[1]||12192000),cy=+(m?.[2]||6858000),w=Math.round(cx*(+$('#logoSize').value/100)),h=Math.round(w/logoRatio),px=Math.max(0,Math.min(cx-w,Math.round(cx*x/100-w/2))),py=Math.max(0,Math.min(cy-h,Math.round(cy*y/100-h/2))),alpha=Math.round(+$('#logoOpacity').value*1000);
      const slidePath='ppt/slides/slide1.xml',relsPath='ppt/slides/_rels/slide1.xml.rels';if(!zip.file(slidePath))throw new Error('Cover slide not found');let rels=zip.file(relsPath)?await zip.file(relsPath).async('text'):'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"></Relationships>',rid=nextRid(rels);rels=rels.replace('</Relationships>',`<Relationship Id="${rid}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="../media/sweater-logo.png"/></Relationships>`);zip.file(relsPath,rels);
      let xml=await zip.file(slidePath).async('text'),pic=`<p:pic><p:nvPicPr><p:cNvPr id="9000" name="SWEATER Logo"/><p:cNvPicPr/><p:nvPr/></p:nvPicPr><p:blipFill><a:blip r:embed="${rid}"><a:alphaModFix amt="${alpha}"/></a:blip><a:stretch><a:fillRect/></a:stretch></p:blipFill><p:spPr><a:xfrm><a:off x="${px}" y="${py}"/><a:ext cx="${w}" cy="${h}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom><a:noFill/><a:ln><a:noFill/></a:ln></p:spPr></p:pic>`;xml=xml.replace('</p:spTree>',pic+'</p:spTree>');zip.file(slidePath,xml);progress(90,'إضافة الشعار إلى شريحة الغلاف');
      return zip.generateAsync({type:'blob',compression:'DEFLATE'});
    }
    $('#fileInput').onchange=e=>useFile(e.target.files[0]);$('#removeFile').onclick=removeFile;const drop=$('#fileDrop');['dragenter','dragover'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.remove('drag')}));drop.addEventListener('drop',e=>useFile(e.dataTransfer.files[0]));
    $('#logoInput').onchange=e=>{const f=e.target.files[0];if(f)normalizeLogo(f).catch(()=>toast('تعذر قراءة الشعار'))};
    $$('.pos').filter(b=>b.dataset.pos).forEach(b=>b.onclick=()=>{[x,y]=b.dataset.pos.split(',').map(Number);$$('.pos').filter(p=>p.dataset.pos).forEach(p=>p.classList.toggle('active',p===b));syncOverlay()});
    $('#logoSize').oninput=e=>{$('#sizeValue').textContent=e.target.value+'%';syncOverlay()};$('#logoOpacity').oninput=e=>{$('#opacityValue').textContent=e.target.value+'%';syncOverlay()};
    $('#exportBtn').onclick=async()=>{if(!file||!logoBytes)return;$('#exportBtn').disabled=true;progress(5,'بدء معالجة الملف…');try{if(fileType==='pdf'){const bytes=await exportPdf();download(bytes,file.name.replace(/\.pdf$/i,'-cover-logo.pdf'),'application/pdf')}else{const blob=await exportPptx();download(blob,file.name.replace(/\.pptx$/i,'-cover-logo.pptx'),'application/vnd.openxmlformats-officedocument.presentationml.presentation')}progress(100);toast('تم التصدير — الشعار على الغلاف فقط')}catch(error){console.error(error);progress(100);toast('تعذر تصدير الملف')}finally{updateReady()}};
    $('#themeBtn').onclick=()=>{document.documentElement.classList.toggle('dark');const dark=document.documentElement.classList.contains('dark');localStorage.setItem('swDark',dark?'1':'0');$('#themeBtn i').className=dark?'fa-solid fa-sun':'fa-solid fa-moon'};if(localStorage.getItem('swDark')==='1'){document.documentElement.classList.add('dark');$('#themeBtn i').className='fa-solid fa-sun'}
    window.addEventListener('sweater:apply-admin-template',e=>{const p=e.detail?.payload||{};if(p.size)$('#logoSize').value=p.size;if(p.opacity)$('#logoOpacity').value=p.opacity;if(p.x!=null)x=p.x;if(p.y!=null)y=p.y;$('#sizeValue').textContent=$('#logoSize').value+'%';$('#opacityValue').textContent=$('#logoOpacity').value+'%';syncOverlay()});
  })();
  </script>
  <script src="./site-config.js?v=6"></script><script src="./sweater-ui.js?v=8"></script><script src="./local-studio.js?v=6"></script>
</body>
</html>
