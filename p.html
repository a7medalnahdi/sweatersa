<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>صفحة | SWEATER</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-config.js?v=1"></script><script src="./supabase-app.js?v=3"></script>
  <style>@font-face{font-family:LamaSans;src:url('./fonts/LamaSans-Regular.woff2')}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f6f9;font-family:LamaSans,Arial,sans-serif}iframe{display:block;width:100%;height:100%;border:0;background:#fff}iframe[hidden]{display:none!important}.state{position:fixed;inset:0;display:grid;place-items:center;background:#f4f6f9;color:#64748b;text-align:center;padding:25px}.state strong{display:block;color:#172033;font-size:17px}.state p{font-size:12px;line-height:1.8}.state a{display:inline-flex;margin-top:8px;padding:10px 14px;border-radius:10px;background:#ef5b0c;color:#fff;text-decoration:none;font-size:12px;font-weight:700}</style>
</head>
<body>
  <div class="state" id="state"><div><strong>جارٍ تحميل الصفحة…</strong></div></div>
  <iframe id="page" title="الصفحة المنشورة" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox" hidden></iframe>
  <script>(()=>{'use strict';const client=window.SweaterCloud?.client,slug=decodeURIComponent(location.hash.slice(1));window.addEventListener('load',async()=>{if(!slug)return fail('الرابط غير مكتمل');const{data,error}=await client.from('html_pages').select('title,html_code').eq('slug',slug).eq('status','published').maybeSingle();if(error||!data)return fail('الصفحة غير موجودة أو غير منشورة');document.title=`${data.title} | SWEATER`;document.getElementById('page').srcdoc=data.html_code;document.getElementById('page').hidden=false;document.getElementById('state').remove()});function fail(message){document.getElementById('state').innerHTML=`<div><strong>${message}</strong><p>تأكد من الرابط أو تواصل مع مدير النظام.</p><a href="./index.html">العودة للمنصة</a></div>`}})();</script>
</body>
</html>
