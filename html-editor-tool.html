<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>مستعرض صفحات HTML | SWEATER</title>
  <link rel="stylesheet" href="./sweater-ui.css?v=11"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-config.js?v=1"></script><script src="./supabase-app.js?v=3"></script><script src="./auth-gateway.js?v=3"></script>
  <style>
    @font-face{font-family:LamaSans;src:url('./fonts/LamaSans-Regular.woff2')}@font-face{font-family:LamaSans;src:url('./fonts/LamaSans-Bold.woff2');font-weight:700}@font-face{font-family:LamaSans;src:url('./fonts/LamaSans-ExtraBold.woff2');font-weight:800}
    :root{--a:#f96714;--ink:#172033;--muted:#748094;--line:#e3e8ef;--soft:#f4f6f9}*{box-sizing:border-box}body{margin:0;background:#eef1f5;color:var(--ink);font-family:LamaSans,Arial,sans-serif}button,input,textarea{font:inherit}.head{height:70px;padding:0 20px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.brand,.actions{display:flex;align-items:center;gap:10px}.back,.icon{width:42px;height:42px;border:1px solid var(--line);border-radius:12px;background:#fff;color:#64748b;display:grid;place-items:center;text-decoration:none}.mark{width:43px;height:43px;border-radius:13px;background:#fff0e7;color:var(--a);display:grid;place-items:center}.brand strong{display:block;font-size:14px}.brand small{display:block;margin-top:3px;color:var(--muted);font-size:9px}.btn{height:42px;padding:0 15px;border:1px solid var(--line);border-radius:11px;background:#fff;color:#536176;font-size:10px;font-weight:800;display:inline-flex;align-items:center;gap:8px}.btn[hidden]{display:none!important}.btn.primary{border-color:var(--a);background:var(--a);color:#fff}.btn.dark{background:#172033;color:#fff;border-color:#172033}.btn.danger{color:#dc2626}.app{height:calc(100vh - 70px);padding:16px;display:grid;grid-template-columns:285px minmax(0,1fr);gap:14px}.side,.editor{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden}.side{display:flex;flex-direction:column}.side-head{padding:15px;border-bottom:1px solid var(--line)}.side-head button{width:100%;justify-content:center}.search{margin-top:10px;width:100%;height:40px;border:1px solid var(--line);border-radius:10px;padding:0 11px;outline:none}.pages{padding:10px;overflow:auto}.page-row{width:100%;padding:11px;border:0;border-radius:12px;background:transparent;text-align:right;display:flex;gap:10px;align-items:center;color:var(--ink)}.page-row:hover,.page-row.active{background:#fff3eb}.page-row i{width:34px;height:34px;border-radius:10px;background:#f1f5f9;display:grid;place-items:center;color:#64748b}.page-row.active i{background:var(--a);color:#fff}.page-row strong{display:block;font-size:10px}.page-row small{display:block;margin-top:3px;color:var(--muted);font-size:8px}.empty{padding:35px 15px;text-align:center;color:var(--muted);font-size:10px;line-height:1.8}.editor{display:grid;grid-template-rows:auto minmax(0,1fr)}.editor-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:end}.field{flex:1}.field.slug{max-width:240px}.field label{display:block;margin-bottom:6px;color:#637086;font-size:8px;font-weight:800}.field input{width:100%;height:41px;border:1px solid var(--line);border-radius:10px;padding:0 11px;outline:0}.field input:focus{border-color:#fb923c;box-shadow:0 0 0 3px #fff0e7}.status{height:41px;padding:0 12px;border:1px solid #bbf7d0;border-radius:10px;background:#f0fdf4;color:#15803d;font-size:9px;font-weight:800;display:flex;align-items:center;gap:7px}.work{min-height:0;padding:14px;display:grid;grid-template-columns:minmax(330px,44%) minmax(0,1fr);gap:14px}.code-panel,.preview{min-height:0;border:1px solid var(--line);border-radius:15px;overflow:hidden;background:#fff}.panel-title{height:45px;padding:0 13px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;font-size:10px;font-weight:800}.panel-title span{color:var(--muted);font-size:8px}.code{width:100%;height:calc(100% - 45px);resize:none;border:0;outline:0;padding:16px;background:#111827;color:#e5e7eb;direction:ltr;text-align:left;font:13px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace;tab-size:2}.preview iframe{display:block;width:100%;height:calc(100% - 45px);border:0;background:#fff}.toast{position:fixed;left:18px;bottom:18px;max-width:350px;padding:12px 15px;border-radius:11px;background:#172033;color:#fff;font-size:10px;font-weight:800;opacity:0;transform:translateY(10px);transition:.2s;z-index:500}.toast.show{opacity:1;transform:none}.loading{opacity:.6;pointer-events:none}@media(max-width:900px){body{overflow:auto}.app{height:auto;grid-template-columns:1fr}.side{max-height:300px}.editor{min-height:760px}.work{grid-template-columns:1fr;grid-template-rows:360px 430px}}@media(max-width:600px){.head{padding:0 10px}.brand small,.actions .btn span{display:none}.editor-head{align-items:stretch;flex-direction:column}.field.slug{max-width:none}.work{padding:9px}.app{padding:9px}}
  </style>
</head>
<body>
  <header class="head"><div class="brand"><a class="back" href="./index.html"><i class="fa-solid fa-arrow-right"></i></a><span class="mark"><i class="fa-solid fa-code"></i></span><div><strong>مستعرض صفحات HTML</strong><small>إنشاء صفحات داخلية ونشرها بروابط مستقلة</small></div></div><div class="actions"><button class="btn danger" id="deleteBtn" hidden><i class="fa-regular fa-trash-can"></i><span>حذف</span></button><button class="btn" id="saveBtn"><i class="fa-regular fa-floppy-disk"></i><span>حفظ مسودة</span></button><button class="btn primary" id="publishBtn"><i class="fa-solid fa-globe"></i><span>نشر الصفحة</span></button><button class="btn" id="copyBtn" hidden><i class="fa-regular fa-copy"></i><span>نسخ الرابط</span></button><button class="btn dark" id="openBtn" hidden><i class="fa-solid fa-arrow-up-right-from-square"></i><span>فتح الرابط</span></button></div></header>
  <main class="app"><aside class="side"><div class="side-head"><button class="btn primary" id="newBtn"><i class="fa-solid fa-plus"></i> إنشاء صفحة</button><input class="search" id="search" placeholder="ابحث في الصفحات…"></div><div class="pages" id="pages"></div></aside><section class="editor" id="editor"><div class="editor-head"><div class="field"><label>اسم الصفحة</label><input id="title" placeholder="مثال: صفحة حملة الصيف"></div><div class="field slug"><label>الرابط المختصر</label><input id="slug" dir="ltr" placeholder="summer-campaign"></div><div class="status" id="status"><i class="fa-solid fa-circle"></i><span>مسودة جديدة</span></div></div><div class="work"><div class="code-panel"><div class="panel-title"><div><i class="fa-solid fa-code"></i> كود HTML</div><span>يتم تحديث المعاينة تلقائيًا</span></div><textarea class="code" id="code" spellcheck="false" placeholder="<!DOCTYPE html>\n<html>\n  ...\n</html>"></textarea></div><div class="preview"><div class="panel-title"><div><i class="fa-regular fa-eye"></i> المعاينة</div><span>بيئة عرض معزولة</span></div><iframe id="preview" sandbox="allow-scripts allow-forms allow-modals"></iframe></div></div></section></main><div class="toast" id="toast"></div>
  <script>
  (()=>{'use strict';const $=id=>document.getElementById(id),client=window.SweaterCloud?.client;let pages=[],activeId=null,timer=null;const starter='<!DOCTYPE html>\n<html lang="ar" dir="rtl">\n<head>\n  <meta charset="UTF-8">\n  <meta name="viewport" content="width=device-width, initial-scale=1">\n  <title>صفحتي</title>\n  <style>\n    body { font-family: Arial, sans-serif; padding: 40px; }\n  </style>\n</head>\n<body>\n  <h1>مرحباً بك</h1>\n  <p>ابدأ بتعديل كود الصفحة.</p>\n</body>\n</html>';
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const toast=m=>{const e=$('toast');e.textContent=m;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2600)};const slugify=s=>String(s||'').trim().toLowerCase().replace(/[^a-z0-9\s-]/g,'').replace(/[\s_-]+/g,'-').replace(/^-+|-+$/g,'').slice(0,70);const linkFor=p=>`${location.origin}${location.pathname.replace(/html-editor-tool\.html$/,'html-page.html')}?page=${encodeURIComponent(p.slug)}`;
    function preview(){clearTimeout(timer);timer=setTimeout(()=>{$('preview').srcdoc=$('code').value||''},250)}function status(p){const published=p?.status==='published';$('status').innerHTML=`<i class="fa-solid fa-circle"></i><span>${published?'منشورة':'مسودة'}</span>`;$('status').style.cssText=published?'border-color:#bbf7d0;background:#f0fdf4;color:#15803d':'border-color:#fde68a;background:#fffbeb;color:#a16207'}function render(){const q=$('search').value.trim().toLowerCase(),list=pages.filter(p=>!q||`${p.title} ${p.slug}`.toLowerCase().includes(q));$('pages').innerHTML=list.length?list.map(p=>`<button class="page-row ${p.id===activeId?'active':''}" data-id="${p.id}"><i class="fa-regular fa-file-code"></i><span><strong>${esc(p.title)}</strong><small>${p.status==='published'?'منشورة':'مسودة'} · /${esc(p.slug)}</small></span></button>`).join(''):'<div class="empty"><i class="fa-regular fa-folder-open"></i><br>لا توجد صفحات بعد.<br>ابدأ بإنشاء أول صفحة.</div>';$('pages').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>select(b.dataset.id))}function select(id){const p=pages.find(x=>x.id===id);if(!p)return;activeId=p.id;$('title').value=p.title;$('slug').value=p.slug;$('code').value=p.html_code||'';$('deleteBtn').hidden=false;$('openBtn').hidden=p.status!=='published';$('copyBtn').hidden=p.status!=='published';status(p);preview();render()}function fresh(){activeId=null;delete $('slug').dataset.edited;$('title').value='';$('slug').value='';$('code').value=starter;$('deleteBtn').hidden=true;$('openBtn').hidden=true;$('copyBtn').hidden=true;status(null);preview();render();$('title').focus()}
    async function load(){const {data,error}=await client.from('html_pages').select('id,title,slug,html_code,status,created_at,updated_at').order('updated_at',{ascending:false});if(error)throw error;pages=data||[];render();if(activeId&&pages.some(p=>p.id===activeId))select(activeId);else fresh()}async function save(nextStatus){const title=$('title').value.trim(),slug=slugify($('slug').value||title),html_code=$('code').value;if(!title)return toast('اكتب اسم الصفحة أولاً');if(!slug)return toast('اكتب رابطًا مختصرًا بالإنجليزية');const payload={title,slug,html_code,status:nextStatus||pages.find(p=>p.id===activeId)?.status||'draft',updated_at:new Date().toISOString()};document.body.classList.add('loading');try{let result;if(activeId)result=await client.from('html_pages').update(payload).eq('id',activeId).select().single();else result=await client.from('html_pages').insert(payload).select().single();if(result.error)throw result.error;activeId=result.data.id;await load();toast(payload.status==='published'?'تم نشر الصفحة وإنشاء الرابط':'تم حفظ الصفحة كمسودة')}catch(e){console.error(e);toast(e.code==='23505'?'هذا الرابط مستخدم، اختر رابطًا آخر':e.message||'تعذر الحفظ')}finally{document.body.classList.remove('loading')}}
    $('newBtn').onclick=fresh;$('saveBtn').onclick=()=>save('draft');$('publishBtn').onclick=()=>save('published');$('copyBtn').onclick=async()=>{const p=pages.find(x=>x.id===activeId);if(!p)return;try{await navigator.clipboard.writeText(linkFor(p));toast('تم نسخ رابط الصفحة')}catch(_){prompt('انسخ رابط الصفحة',linkFor(p))}};$('openBtn').onclick=()=>{const p=pages.find(x=>x.id===activeId);if(p)window.open(linkFor(p),'_blank','noopener')};$('deleteBtn').onclick=async()=>{if(!activeId||!confirm('حذف هذه الصفحة نهائيًا؟'))return;const {error}=await client.from('html_pages').delete().eq('id',activeId);if(error)return toast('تعذر حذف الصفحة');activeId=null;await load();toast('تم حذف الصفحة')};$('search').oninput=render;$('title').oninput=()=>{if(!activeId&&!$('slug').dataset.edited)$('slug').value=slugify($('title').value)};$('slug').oninput=()=>{$('slug').dataset.edited='1';$('slug').value=slugify($('slug').value)};$('code').oninput=preview;
    window.addEventListener('load',async()=>{const user=await window.SweaterAuthReady?.catch(()=>null);if(user?.role!=='admin'){location.replace('./index.html');return}try{await load()}catch(e){console.error(e);toast('تعذر تحميل الصفحات')}});
  })();
  </script><script src="./site-config.js?v=16"></script><script src="./sweater-ui.js?v=9"></script>
</body></html>
