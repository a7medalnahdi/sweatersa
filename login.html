<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>تسجيل الدخول | SWEATER</title>
  <link rel="stylesheet" href="./sweater-ui.css?v=12">
  <link rel="stylesheet" href="./local-studio.css?v=6">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    :root{--orange:#f96714;--ink:#172033;--muted:#78869a;--line:#e5e9ef}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:'LamaSans',sans-serif;color:var(--ink);background:#f6f7f9}button,input{font:inherit}.auth-page{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(390px,100%)}.logo{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:32px}.logo-mark{width:42px;height:42px;display:grid;place-items:center;border-radius:13px;background:var(--orange);color:#fff}.logo strong{display:block;font-size:13px}.logo span{display:block;color:#98a2b3;font-size:8px;margin-top:2px}.welcome{text-align:center;margin-bottom:22px}.welcome h1{font-size:25px;margin:0 0 7px}.welcome p{margin:0;color:var(--muted);font-size:10px;line-height:1.8}.form{padding:24px;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:0 14px 40px #0f172a0a}.field{margin-bottom:14px}.field label{display:block;margin-bottom:7px;color:#536176;font-size:9px;font-weight:900}.input-wrap{position:relative}.input-wrap>i{position:absolute;right:13px;top:50%;transform:translateY(-50%);color:#9aa6b7;font-size:11px}.field input{width:100%;height:46px;border:1px solid var(--line);border-radius:11px;background:#fafbfc;padding:0 38px 0 12px;outline:none;font-size:11px;font-weight:700;direction:ltr;text-align:right}.field input:focus{border-color:#fb923c;background:#fff;box-shadow:0 0 0 3px #fff0e7}.pass-toggle{position:absolute;left:7px;top:7px;width:32px;height:32px;border:0;border-radius:8px;background:transparent;color:#94a3b8}.form-row{display:flex;align-items:center;justify-content:space-between;margin:2px 0 17px;font-size:9px}.remember{display:flex;gap:6px;color:#657286}.form-row a{color:#c2410c;text-decoration:none;font-weight:900}.submit{width:100%;height:46px;border:0;border-radius:11px;background:var(--orange);color:#fff;font-size:11px;font-weight:900;cursor:pointer}.submit:hover{background:#e85b0b}.submit:disabled{opacity:.6}.error{display:none;margin-bottom:12px;padding:10px 11px;border-radius:10px;background:#fff1f2;color:#be123c;font-size:9px;font-weight:800}.error.show{display:block}.access-note{margin:15px 0 0;text-align:center;color:#98a2b3;font-size:8px;line-height:1.8}@media(max-width:480px){.auth-page{padding:18px}.logo{margin-bottom:25px}.form{padding:20px}}
  </style>
  <style>
    .logo strong{font-size:17px}.logo span{font-size:12px}.welcome p{font-size:14px}.field label{font-size:13px}.field input{height:50px;font-size:14px}.form-row{font-size:12px}.submit{height:50px;font-size:14px}.error{font-size:12px}.access-note{font-size:11px}.form{padding:27px}
  </style>
</head>
<body>
<main class="auth-page">
    <div class="card">
      <div class="logo"><div class="logo-mark"><i class="fa-solid fa-sparkles"></i></div><div><strong>SWEATER Workspace</strong><span>مساحة العمل الداخلية</span></div></div>
      <div class="welcome"><h1>تسجيل الدخول</h1><p>أدخل بيانات حسابك للمتابعة.</p></div>
      <form class="form" id="loginForm">
        <div class="error" id="errorBox"></div>
        <div class="field"><label>البريد الإلكتروني</label><div class="input-wrap"><i class="fa-regular fa-envelope"></i><input name="identity" type="email" autocomplete="username" required autofocus></div></div>
        <div class="field"><label>كلمة المرور</label><div class="input-wrap"><i class="fa-solid fa-key"></i><input id="password" name="password" type="password" autocomplete="current-password" required><button type="button" class="pass-toggle" id="togglePass" aria-label="إظهار كلمة المرور"><i class="fa-regular fa-eye"></i></button></div></div>
        <div class="form-row"><label class="remember"><input type="checkbox" name="remember" checked> تذكر تسجيل الدخول</label><a href="./forgot-password.html">نسيت كلمة المرور؟</a></div>
        <button class="submit" id="submitBtn"><i class="fa-solid fa-arrow-right-to-bracket"></i> تسجيل الدخول</button>
      </form>
      <p class="access-note"><i class="fa-solid fa-lock"></i> الدخول مخصص لفريق العمل</p>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-config.js?v=1"></script><script src="./supabase-app.js?v=3"></script>
<script>
(()=>{
  const $=s=>document.querySelector(s),client=window.SweaterCloud.client;
  client.auth.getSession().then(({data})=>{if(data.session){const next=new URLSearchParams(location.search).get('next');location.replace(next?`./${next}`:'./index.html')}});
  const queryError=new URLSearchParams(location.search).get('error');if(queryError){$('#errorBox').textContent=queryError==='suspended'?'هذا الحساب موقوف. تواصل مع مدير النظام.':'تعذر تحميل ملف الحساب.';$('#errorBox').classList.add('show')}
  $('#togglePass').onclick=()=>{const p=$('#password'),show=p.type==='password';p.type=show?'text':'password';$('#togglePass i').className=show?'fa-regular fa-eye-slash':'fa-regular fa-eye'};
  $('#loginForm').onsubmit=async e=>{
    e.preventDefault();const f=Object.fromEntries(new FormData(e.currentTarget)),email=f.identity.trim().toLowerCase(),box=$('#errorBox'),button=$('#submitBtn');
    button.disabled=true;button.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> جارٍ التحقق';
    box.classList.remove('show');
    const result=await client.auth.signInWithPassword({email,password:f.password});
    if(result.error){box.textContent=result.error.message==='Invalid login credentials'?'البريد الإلكتروني أو كلمة المرور غير صحيحة.':result.error.message;box.classList.add('show');button.disabled=false;button.innerHTML='<i class="fa-solid fa-arrow-right-to-bracket"></i> تسجيل الدخول';return}
    const next=new URLSearchParams(location.search).get('next');location.replace(next?`./${next}`:'./index.html');
  };
})();
</script>
</body>
</html>
