<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>حسابي | SWEATER</title>
  <link rel="stylesheet" href="./sweater-ui.css?v=11"><link rel="stylesheet" href="./local-studio.css?v=6">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase-config.js?v=1"></script><script src="./supabase-app.js?v=3"></script><script src="./auth-gateway.js?v=3"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f4f6f9;color:#172033;font-family:LamaSans,sans-serif}.head{height:70px;padding:0 6%;display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid #e5e7eb}.head a{color:#64748b;text-decoration:none;font-size:10px;font-weight:900}.wrap{max-width:1000px;margin:auto;padding:35px 20px}.profile{display:grid;grid-template-columns:280px 1fr;gap:15px}.card{padding:20px;border:1px solid #e5e7eb;border-radius:18px;background:#fff}.identity{text-align:center}.avatar{width:75px;height:75px;margin:auto;display:grid;place-items:center;border-radius:22px;background:#f96714;color:#fff;font-size:28px;font-weight:900}.identity h1{font-size:17px;margin:14px 0 4px}.identity p{font-size:9px;color:#8491a4}.badge{display:inline-block;padding:6px 9px;border-radius:8px;background:#fff1e8;color:#c2410c;font-size:8px;font-weight:900}.card h2{font-size:13px;margin:0 0 16px}.details{display:grid;grid-template-columns:1fr 1fr;gap:10px}.detail{padding:13px;border-radius:12px;background:#f8fafc}.detail span,.detail strong{display:block}.detail span{color:#8a96a8;font-size:8px}.detail strong{font-size:10px;margin-top:5px}.cloud{margin-top:15px;padding:15px;border:1px solid #bbf7d0;border-radius:13px;background:#f0fdf4;color:#167458;font-size:9px;line-height:1.9}.logout{width:100%;height:41px;margin-top:14px;border:1px solid #fecdd3;border-radius:11px;background:#fff1f2;color:#be123c;font-size:9px;font-weight:900}@media(max-width:700px){.profile,.details{grid-template-columns:1fr}}
  </style>
  <style>
    .head a{font-size:13px}.identity h1{font-size:21px}.identity p{font-size:13px}.badge{font-size:11px}.card h2{font-size:17px}.detail span{font-size:12px}.detail strong{font-size:14px}.cloud{font-size:13px}.logout{height:46px;font-size:13px}
  </style>
</head>
<body>
  <header class="head"><strong>SWEATER Workspace</strong><a href="./index.html"><i class="fa-solid fa-arrow-right"></i> العودة للرئيسية</a></header>
  <main class="wrap"><div class="profile"><section class="card identity"><div class="avatar" id="avatar"></div><h1 id="name"></h1><p id="email"></p><span class="badge" id="role"></span><button class="logout" id="logout"><i class="fa-solid fa-arrow-right-from-bracket"></i> تسجيل الخروج</button></section><section class="card"><h2>بيانات الحساب</h2><div class="details" id="details"></div><div class="cloud"><i class="fa-solid fa-cloud-arrow-up"></i> حسابك متصل بالمزامنة السحابية. الملفات المدعومة تُحفظ تحت حسابك وتنتقل معك بين الأجهزة.</div></section></div></main>
  <script>
  SweaterAuthReady.then(u=>{if(!u)return;document.querySelector('#avatar').textContent=(u.name||'م')[0];document.querySelector('#name').textContent=u.name;document.querySelector('#email').textContent=u.email||u.username;document.querySelector('#role').textContent=u.role==='admin'?'مدير النظام':'موظف';document.querySelector('#details').innerHTML=`<div class="detail"><span>اسم المستخدم</span><strong>${u.username||'—'}</strong></div><div class="detail"><span>القسم</span><strong>${u.department||'الإدارة'}</strong></div><div class="detail"><span>نوع الحساب</span><strong>${u.role==='admin'?'مدير':'موظف'}</strong></div><div class="detail"><span>حالة المزامنة</span><strong style="color:#059669">متصل</strong></div>`;document.querySelector('#logout').onclick=()=>SweaterAuth.signOut()});
  </script>
</body>
</html>
