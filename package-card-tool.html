<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>صانع كروت الباقات | SWEATER</title>
  <link rel="stylesheet" href="./sweater-ui.css?v=8"><link rel="stylesheet" href="./local-studio.css?v=6">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-config.js?v=1"></script><script src="./supabase-app.js?v=3"></script><script src="./auth-gateway.js?v=3"></script>
  <style>
    @font-face{font-family:LamaSans;src:url('./fonts/LamaSans-Regular.woff2')}@font-face{font-family:LamaSans;src:url('./fonts/LamaSans-Bold.woff2');font-weight:700}@font-face{font-family:LamaSans;src:url('./fonts/LamaSans-ExtraBold.woff2');font-weight:800}
    :root{--a:#f96714;--green:#00b979;--ink:#172033;--muted:#718096;--line:#e5e9ef}*{box-sizing:border-box}body{margin:0;background:#edf0f4;color:var(--ink);font-family:LamaSans,Arial,sans-serif}button,input,select{font:inherit}.head{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:rgba(255,255,255,.95);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}.brand,.actions{display:flex;align-items:center;gap:9px}.back{width:40px;height:40px;display:grid;place-items:center;border-radius:11px;background:#f1f5f9;color:#64748b;text-decoration:none}.mark{width:41px;height:41px;display:grid;place-items:center;border-radius:12px;background:#dcfce7;color:#059669}.brand strong{display:block;font-size:13px}.brand span{display:block;margin-top:3px;color:var(--muted);font-size:8px}.btn{height:40px;padding:0 13px;border:1px solid var(--line);border-radius:10px;background:#fff;color:#536176;font-size:9px;font-weight:900;display:inline-flex;align-items:center;gap:7px}.btn.primary{background:var(--a);border-color:var(--a);color:#fff}.workspace{max-width:1360px;margin:auto;padding:20px;display:grid;grid-template-columns:350px minmax(0,1fr);gap:18px}.panel,.preview-panel{background:#fff;border:1px solid var(--line);border-radius:20px}.panel{padding:17px;align-self:start;position:sticky;top:88px}.panel h2{font-size:12px;margin:0 0 14px}.lang{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:15px}.lang button{height:39px;border:1px solid var(--line);border-radius:10px;background:#fff;color:#64748b;font-size:9px;font-weight:900}.lang button.active{border-color:#86efac;background:#f0fdf4;color:#047857}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field.full{grid-column:1/-1}.field label{display:block;margin-bottom:6px;color:#566377;font-size:8px;font-weight:900}.field input{width:100%;height:41px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:#fafbfc;outline:0;color:var(--ink)}.field input:focus{border-color:#fb923c;background:#fff;box-shadow:0 0 0 3px #fff0e7}.tip{margin-top:14px;padding:10px;border-radius:10px;background:#f8fafc;color:#64748b;font-size:8px;line-height:1.7}.preview-panel{min-height:690px;padding:22px;display:flex;flex-direction:column}.preview-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.preview-head h2{margin:0;font-size:13px}.preview-head span{color:var(--muted);font-size:8px}.stage{flex:1;min-height:560px;border-radius:16px;background:#e7eaf0;display:grid;place-items:center;padding:25px;overflow:auto}.card{position:relative;width:1050px;height:500px;overflow:hidden;border-radius:26px;background:linear-gradient(135deg,#fff 0%,#fbfbff 55%,#f1f0ff 100%);box-shadow:0 22px 60px rgba(15,23,42,.16);transform-origin:center}.badge-row{position:absolute;top:44px;right:55px;display:flex;gap:16px}.badge{height:47px;padding:0 17px;border-radius:9px;display:flex;align-items:center;gap:8px;font-size:22px;font-weight:800}.badge.valid{background:#d7edff;color:#168bf0}.badge.wash{background:#ffe6d8;color:#f96714}.prime{position:absolute;top:92px;left:65px;color:var(--green);font-size:44px;font-weight:800;font-style:italic;line-height:.9;background:#d9f5e8;padding:7px 10px}.prime small{display:block;margin-top:9px;padding:5px;background:#effcf5;font-size:20px;font-style:normal;text-align:center}.copy{position:absolute;top:145px;right:55px;width:760px;text-align:right}.copy h1{margin:0;font-size:49px;line-height:1.3;font-weight:800;color:#070707}.copy p{margin:13px 0 0;color:#74757b;font-size:31px}.price-row{position:absolute;right:55px;bottom:88px;display:flex;align-items:center;gap:18px}.old-price{min-width:165px;padding:8px 22px;border-radius:30px;background:#e5e5e5;color:#252525;font-size:28px;text-align:center;text-decoration:line-through;text-decoration-color:#f05208;text-decoration-thickness:3px}.new-price{display:flex;align-items:center;gap:8px;color:#f05208;font-size:69px;font-weight:800;direction:ltr}.riyal{width:.62em;height:.62em;object-fit:contain;filter:invert(37%) sepia(93%) saturate(2422%) hue-rotate(359deg) brightness(98%) contrast(98%)}.payments{display:flex;gap:9px;align-items:center}.pay{height:34px;min-width:86px;padding:0 12px;border-radius:6px;display:grid;place-items:center;color:#111;font-size:20px;font-weight:800}.tabby{background:#35eea0}.tamara{background:linear-gradient(90deg,#ffd7b1,#fff,#b945d4)}.cta{position:absolute;left:65px;bottom:44px;height:67px;min-width:250px;padding:0 28px;border:0;border-radius:36px;background:var(--green);color:#fff;font-size:30px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:20px}.card.en{direction:ltr}.card.en .badge-row{right:auto;left:55px}.card.en .prime{left:auto;right:65px}.card.en .copy{right:auto;left:55px;text-align:left}.card.en .price-row{right:auto;left:55px}.card.en .cta{left:auto;right:65px}.card.en .cta i{transform:rotate(180deg)}.card.en .price-row{flex-direction:row}.dark body{background:#090d15;color:#fff}.dark .head,.dark .panel,.dark .preview-panel,.dark .lang button,.dark .btn{background:#111827;border-color:#2b384c;color:#e2e8f0}.dark .field input,.dark .tip{background:#172033;border-color:#334155;color:#fff}.dark .stage{background:#0b1220}@media(max-width:950px){.workspace{grid-template-columns:1fr}.panel{position:static}.preview-panel{min-height:auto}.stage{min-height:450px}}@media(max-width:560px){.workspace{padding:12px}.actions .btn span{display:none}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.stage{padding:12px;min-height:330px}}
  </style>
</head>
<body>
  <header class="head"><div class="brand"><a class="back" href="./index.html"><i class="fa-solid fa-arrow-right"></i></a><span class="mark"><i class="fa-solid fa-tags"></i></span><div><strong>صانع كروت الباقات</strong><span>عدّل البيانات وصدّر الكرت مباشرة</span></div></div><div class="actions"><button class="btn" id="pngBtn"><i class="fa-regular fa-image"></i><span>تصدير PNG</span></button><button class="btn primary" id="pdfBtn"><i class="fa-regular fa-file-pdf"></i><span>تصدير PDF</span></button><button class="btn" id="themeBtn"><i class="fa-solid fa-moon"></i></button></div></header>
  <main class="workspace">
    <aside class="panel"><h2>بيانات كرت الباقة</h2><div class="lang"><button class="active" data-lang="ar">العربية</button><button data-lang="en">English</button></div><div class="form-grid">
      <div class="field full"><label>اسم الباقة</label><input id="packageName" value="سويتر برايم"></div>
      <div class="field full"><label>وصف الباقة</label><input id="description" value="5 غسلات ( داخلي وخارجي ) لسيارتك"></div>
      <div class="field"><label>مدة الصلاحية</label><input id="validity" value="صلاحية شهرين"></div>
      <div class="field"><label>سعر الغسلة</label><input id="perWash" value="29"></div>
      <div class="field"><label>السعر السابق</label><input id="oldPrice" type="number" value="299"></div>
      <div class="field"><label>السعر الجديد</label><input id="newPrice" type="number" value="145"></div>
      <div class="field full"><label>نص زر الشراء</label><input id="ctaText" value="اشتر الآن"></div>
    </div><div class="tip"><i class="fa-solid fa-wand-magic-sparkles"></i> كل تعديل يظهر فورًا. الأداة تحافظ تلقائيًا على المقاس والألوان وتنسيق الباقة.</div></aside>
    <section class="preview-panel"><div class="preview-head"><h2>معاينة الكرت</h2><span>1050 × 500</span></div><div class="stage" id="stage"><div class="card" id="packageCard">
      <div class="badge-row"><div class="badge valid"><i class="fa-solid fa-clock"></i><span id="outValidity">صلاحية شهرين</span></div><div class="badge wash"><img class="riyal" src="./assets/saudi-riyal-symbol.svg"><span><b id="outPerWash">29</b> <span id="washSuffix">﷼ / الغسلة</span></span></div></div>
      <div class="prime">PRIME<small id="primeSub">برايم</small></div><div class="copy"><h1 id="outName">سويتر برايم</h1><p id="outDescription">5 غسلات ( داخلي وخارجي ) لسيارتك</p></div>
      <div class="price-row"><div class="old-price"><span id="outOld">299</span></div><div class="new-price"><img class="riyal" src="./assets/saudi-riyal-symbol.svg"><span id="outNew">145</span></div><div class="payments"><span class="pay tabby">tabby</span><span class="pay tamara">تمارا</span></div></div>
      <button class="cta"><i class="fa-solid fa-chevron-left"></i><span id="outCta">اشتر الآن</span></button>
    </div></div></section>
  </main><div id="toast" style="position:fixed;left:18px;bottom:18px;padding:11px 14px;border-radius:10px;background:#111827;color:#fff;font-size:9px;font-weight:800;opacity:0;transition:.2s;z-index:100"></div>
  <script>
  (()=>{'use strict';const $=id=>document.getElementById(id),card=$('packageCard'),fields=['packageName','description','validity','perWash','oldPrice','newPrice','ctaText'];let lang='ar';const toast=m=>{const e=$('toast');e.textContent=m;e.style.opacity=1;setTimeout(()=>e.style.opacity=0,2200)};const values={ar:{packageName:'سويتر برايم',description:'5 غسلات ( داخلي وخارجي ) لسيارتك',validity:'صلاحية شهرين',perWash:'29',oldPrice:'299',newPrice:'145',ctaText:'اشتر الآن'},en:{packageName:'Sweater Prime',description:'5 (IN&OUT) washes',validity:'Valid for 2 months',perWash:'29',oldPrice:'299',newPrice:'145',ctaText:'Buy Now'}};
    function sync(){ $('outName').textContent=$('packageName').value;$('outDescription').textContent=$('description').value;$('outValidity').textContent=$('validity').value;$('outPerWash').textContent=$('perWash').value;$('outOld').textContent=$('oldPrice').value;$('outNew').textContent=$('newPrice').value;$('outCta').textContent=$('ctaText').value;$('primeSub').textContent=lang==='ar'?'برايم':'PRIME';$('washSuffix').textContent=lang==='ar'?'﷼ / الغسلة':'per/wash';card.classList.toggle('en',lang==='en')}
    function switchLang(next){lang=next;fields.forEach(k=>$(k).value=values[next][k]);document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===next));sync();fit()}
    function fit(){const stage=$('stage'),scale=Math.min(1,(stage.clientWidth-30)/1050,(stage.clientHeight-30)/500);card.style.transform=`scale(${Math.max(.25,scale)})`;card.parentElement.style.setProperty('--scale',scale)}
    async function render(){await document.fonts.ready;const prev=card.style.transform;card.style.transform='none';const canvas=await html2canvas(card,{scale:2,useCORS:true,backgroundColor:null});card.style.transform=prev;return canvas}
    function download(url,name){const a=document.createElement('a');a.href=url;a.download=name;a.click()}
    fields.forEach(k=>$(k).oninput=sync);document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>switchLang(b.dataset.lang));$('pngBtn').onclick=async()=>{try{const c=await render();download(c.toDataURL('image/png'),`sweater-package-${lang}.png`);toast('تم تصدير الكرت PNG')}catch(e){console.error(e);toast('تعذر التصدير')}};$('pdfBtn').onclick=async()=>{try{const c=await render(),{jsPDF}=window.jspdf,pdf=new jsPDF({orientation:'landscape',unit:'px',format:[1050,500]});pdf.addImage(c.toDataURL('image/png'),'PNG',0,0,1050,500);pdf.save(`sweater-package-${lang}.pdf`);toast('تم تصدير الكرت PDF')}catch(e){console.error(e);toast('تعذر التصدير')}};$('themeBtn').onclick=()=>document.documentElement.classList.toggle('dark');window.addEventListener('resize',fit);window.addEventListener('sweater:apply-admin-template',e=>{const p=e.detail?.payload||{};if(p.lang)switchLang(p.lang);fields.forEach(k=>{if(p[k]!=null)$(k).value=p[k]});sync()});sync();setTimeout(fit,50);
  })();
  </script><script src="./site-config.js?v=8"></script><script src="./sweater-ui.js?v=8"></script><script src="./local-studio.js?v=7"></script>
</body></html>
