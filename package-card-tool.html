    :root{--a:#f96714;--green:#00b979;--ink:#172033;--muted:#718096;--line:#e5e9ef}*{box-sizing:border-box}body{margin:0;background:#edf0f4;color:var(--ink);font-family:LamaSans,Arial,sans-serif}button,input,select{font:inherit}.head{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:rgba(255,255,255,.95);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}.brand,.actions{display:flex;align-items:center;gap:9px}.back{width:40px;height:40px;display:grid;place-items:center;border-radius:11px;background:#f1f5f9;color:#64748b;text-decoration:none}.mark{width:41px;height:41px;display:grid;place-items:center;border-radius:12px;background:#dcfce7;color:#059669}.brand strong{display:block;font-size:13px}.brand span{display:block;margin-top:3px;color:var(--muted);font-size:8px}.btn{height:40px;padding:0 13px;border:1px solid var(--line);border-radius:10px;background:#fff;color:#536176;font-size:9px;font-weight:900;display:inline-flex;align-items:center;gap:7px}.btn.primary{background:var(--a);border-color:var(--a);color:#fff}.workspace{max-width:1360px;margin:auto;padding:20px;display:grid;grid-template-columns:350px minmax(0,1fr);gap:18px}.panel,.preview-panel{background:#fff;border:1px solid var(--line);border-radius:20px}.panel{padding:17px;align-self:start;position:sticky;top:88px}.panel h2{font-size:12px;margin:0 0 14px}.lang{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:15px}.lang button{height:39px;border:1px solid var(--line);border-radius:10px;background:#fff;color:#64748b;font-size:9px;font-weight:900}.lang button.active{border-color:#86efac;background:#f0fdf4;color:#047857}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field.full{grid-column:1/-1}.field label{display:block;margin-bottom:6px;color:#566377;font-size:8px;font-weight:900}.field input{width:100%;height:41px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:#fafbfc;outline:0;colo     .card{font-family:'IBM Plex Sans Arabic',Arial,sans-serif;background:var(--card-bg,#f8f8ff)}.badge.valid{background:var(--valid-bg,#d7edff);color:var(--valid-color,#168bf0)}.badge.wash{background:var(--wash-bg,#ffe6d8);color:var(--wash-color,#f96714);direction:ltr}.new-price{color:var(--price-color,#f05208)}.cta{background:var(--cta-color,#00b979)}.package-logo{position:absolute;top:88px;left:65px;width:178px;height:104px;display:none;place-items:center;overflow:hidden}.package-logo.has-logo{display:grid}.package-logo img{width:100%;height:100%;object-fit:contain}.card.en .package-logo{left:auto;right:65px}.payments img{display:block;width:205px;height:auto;max-height:42px;object-fit:contain}.payments.is-hidden{display:none}.riyal{display:block;flex:0 0 auto;width:.62em;height:.7em;color:inherit;filter:none}.badge .riyal{width:20px;height:23px}.per-wash-number{display:inline-flex;align-items:flex-start;direction:ltr}.per-wash-number small{font-size:.62em;line-height:1;margin-top:2px}.old-price{position:relative;text-decoration:none}.old-price span{position:relative;display:inline-block}.old-price span::after{content:"";position:absolute;left:-7px;right:-7px;top:50%;height:3px;border-radius:4px;background:var(--price-color,#f05208);transform:rotate(-5deg);transform-origin:center}.color-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.color-field{padding:8px;border:1px solid var(--line);border-radius:10px;background:#fafbfc}.color-field label{display:block;font-size:7px;font-weight:800;color:#64748b;margin-bottom:6px}.color-field input{width:100%;height:30px;border:0;padding:0;background:transparent}.logo-upload{margin-top:10px}.logo-upload input{padding:9px;height:auto}.toggle-field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fafbfc}.toggle-field label{margin:0}.toggle-field input{width:42px;height:22px;accent-color:#00b979}

<body>
  <header class="head"><div class="brand"><a class="back" href="./index.html"><i class="fa-solid fa-arrow-right"></i></a><span class="mark"><i class="fa-solid fa-tags"></i></span><div><strong>صانع كروت الباقات</strong><span>عدّل البيانات وصدّر الكرت مباشرة</span></div></div><div class="actions"><button class="btn" id="pngBtn"><i class="fa-regular fa-image"></i><span>تصدير PNG</span></button><button class="btn primary" id="pdfBtn"><i class="fa-regular fa-file-pdf"></i><span>تصدير PDF</span></button><button class="btn" id="themeBtn"><i class="fa-solid fa-moon"></i></button></div></header>
  <main class="workspace">
    <aside class="panel"><h2>بيانات كرت الباقة</h2><div class="lang"><button class="active" data-lang="ar">العربية</button><button data-lang="en">English</button></div><div class="form-grid">
      <div class="field full"><label>اسم الباقة</label><input id="packageName" value="سويتر برايم"></div>
      <div class="field full"><label>وصف الباقة</label><input id="description" value="5 غسلات ( داخلي وخارجي ) لسيارتك"></div>
      <div class="field"><label>مدة الصلاحية</label><input id="validity" value="صلاحية شهرين"></div>
      <div class="field"><label>سعر الغسلة</label><input id="perWash" value="29"></div>
      <div class="field"><label>السعر السابق</label><input id="oldPrice" type="number" value="299"></div>
      <div class="field"><label>السعر الجديد</label><input id="newPrice" type="number" value="145"></div>
      <div class="field full"><label>نص زر الشراء</label><input id="ctaText" value="اشتر الآن"></div>
      <div class="field full toggle-field"><label for="showPayments">إظهار شعارات تابي وتمارا</label><input id="showPayments" type="checkbox" checked></div>
      <div class="field full logo-upload"><label>شعار الباقة (اختياري)</label><input id="packageLogoInput" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml"></div>
      <div class="field full"><label>ألوان الكرت</label><div class="color-grid">
        <div class="color-field"><label>زر الشراء</label><input id="ctaColor" type="color" value="#00b979"></div>
        <div class="color-field"><label>السعر</label><input id="priceColor" type="color" value="#f05208"></div>
        <div class="color-field"><label>الخلفية</label><input id="cardColor" type="color" value="#f8f8ff"></div>
        <div class="color-field"><label>شارة الصلاحية</label><input id="validColor" type="color" value="#d7edff"></div>
        <div class="color-field"><label>شارة الغسلة</label><input id="washColor" type="color" value="#ffe6d8"></div>
        <div class="color-field"><label>نص شارة الغسلة</label><input id="washTextColor" type="color" value="#f96714"></div>
      </div></div>
    </div><div class="tip"><i class="fa-solid fa-wand-magic-sparkles"></i> كل تعديل يظهر فورًا. الأداة تحافظ تلقائيًا على المقاس والألوان وتنسيق الباقة.</div></aside>
    <section class="preview-panel"><div class="preview-head"><h2>معاينة الكرت</h2><span>1050 × 500</span></div><div class="stage" id="stage"><div class="card-wrap" id="cardWrap"><div class="card" id="packageCard">
      <div class="badge-row"><div class="badge valid"><i class="fa-solid fa-clock"></i><span id="outValidity">صلاحية شهرين</span></div><div class="badge wash"><svg class="riyal" viewBox="0 0 1124.14 1256.39" aria-label="ريال"><path fill="currentColor" d="M699.62 1113.02c-20.06 44.48-33.32 92.75-38.4 143.37l424.51-90.24c20.06-44.47 33.31-92.75 38.4-143.37l-424.51 90.24Z"/><path fill="currentColor" d="M1085.73 895.8c20.06-44.47 33.32-92.75 38.4-143.37l-330.68 70.33v-135.2l292.27-62.11c20.06-44.47 33.32-92.75 38.4-143.37l-330.68 70.27V66.13c-50.67 28.45-95.67 66.32-132.25 110.99v403.35l-132.25 28.11V0c-50.67 28.44-95.67 66.32-132.25 110.99v525.69l-295.91 62.88c-20.06 44.47-33.33 92.75-38.42 143.37l334.33-71.05v170.26l-358.3 76.14c-20.06 44.47-33.32 92.75-38.4 143.37l375.04-79.7c30.53-6.35 56.77-24.4 73.83-49.24l68.78-101.97c7.14-10.57 11.3-23.29 11.3-36.99v-149.98l132.25-28.11v270.4l424.53-90.28Z"/></svg><span class="per-wash-number"><b id="outPerWashWhole">29</b><small id="outPerWashDecimal"></small></span><span id="washSuffix">/ الغسلة</span></div></div>
      <div class="package-logo" id="packageLogo"><img id="packageLogoImage" alt="شعار الباقة"></div><div class="copy"><h1 id="outName">سويتر برايم</h1><p id="outDescription">5 غسلات ( داخلي وخارجي ) لسيارتك</p></div>
      <div class="price-row"><div class="old-price"><span id="outOld">299</span></div><div class="new-price"><svg class="riyal" viewBox="0 0 1124.14 1256.39" aria-label="ريال"><path fill="currentColor" d="M699.62 1113.02c-20.06 44.48-33.32 92.75-38.4 143.37l424.51-90.24c20.06-44.47 33.31-92.75 38.4-143.37l-424.51 90.24Z"/><path fill="currentColor" d="M1085.73 895.8c20.06-44.47 33.32-92.75 38.4-143.37l-330.68 70.33v-135.2l292.27-62.11c20.06-44.47 33.32-92.75 38.4-143.37l-330.68 70.27V66.13c-50.67 28.45-95.67 66.32-132.25 110.99v403.35l-132.25 28.11V0c-50.67 28.44-95.67 66.32-132.25 110.99v525.69l-295.91 62.88c-20.06 44.47-33.33 92.75-38.42 143.37l334.33-71.05v170.26l-358.3 76.14c-20.06 44.47-33.32 92.75-38.4 143.37l375.04-79.7c30.53-6.35 56.77-24.4 73.83-49.24l68.78-101.97c7.14-10.57 11.3-23.29 11.3-36.99v-149.98l132.25-28.11v270.4l424.53-90.28Z"/></svg><span id="outNew">145</span></div><div class="payments" id="payments"><img src="./assets/payment-logos.png" alt="تابي وتمارا"></div></div>
      <button class="cta"><i class="fa-solid fa-chevron-left"></i><span id="outCta">اشتر الآن</span></button>
    </div></div></div></section>
  </main><div id="toast" style="position:fixed;left:18px;bottom:18px;padding:11px 14px;border-radius:10px;background:#111827;color:#fff;font-size:9px;font-weight:800;opacity:0;transition:.2s;z-index:100"></div>
  <script>
  (()=>{'use strict';const $=id=>document.getElementById(id),card=$('packageCard'),fields=['packageName','description','validity','perWash','oldPrice','newPrice','ctaText'],colorFields=['ctaColor','priceColor','cardColor','validColor','washColor','washTextColor'];let lang='ar';const toast=m=>{const e=$('toast');e.textContent=m;e.style.opacity=1;setTimeout(()=>e.style.opacity=0,2200)};const values={ar:{packageName:'سويتر برايم',description:'5 غسلات ( داخلي وخارجي ) لسيارتك',validity:'صلاحية شهرين',perWash:'29',oldPrice:'299',newPrice:'145',ctaText:'اشتر الآن'},en:{packageName:'Sweater Prime',description:'5 (IN&OUT) washes',validity:'Valid for 2 months',perWash:'29',oldPrice:'299',newPrice:'145',ctaText:'Buy Now'}};
    function sync(){const raw=$('perWash').value.trim().replace(',','.');const parts=raw.split('.'),whole=parts[0]||'0',fraction=parts[1]||'';$('outName').textContent=$('packageName').value;$('outDescription').textContent=$('description').value;$('outValidity').textContent=$('validity').value;$('outPerWashWhole').textContent=whole;$('outPerWashDecimal').textContent=fraction?'.'+fraction:'';$('outOld').textContent=$('oldPrice').value;$('outNew').textContent=$('newPrice').value;$('outCta').textContent=$('ctaText').value;$('washSuffix').textContent=lang==='ar'?'/ الغسلة':'per/wash';$('payments').classList.toggle('is-hidden',!$('showPayments').checked);card.style.setProperty('--cta-color',$('ctaColor').value);card.style.setProperty('--price-color',$('priceColor').value);card.style.setProperty('--card-bg',$('cardColor').value);card.style.setProperty('--valid-bg',$('validColor').value);card.style.setProperty('--wash-bg',$('washColor').value);card.style.setProperty('--wash-color',$('washTextColor').value);card.classList.toggle('en',lang==='en')}
    function switchLang(next){lang=next;fields.forEach(k=>$(k).value=values[next][k]);document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===next));sync();fit()}
    function fit(){const stage=$('stage'),scale=Math.max(.25,Math.min(1,(stage.clientWidth-30)/1050,(stage.clientHeight-30)/500)),wrap=$('cardWrap');card.style.transform=`scale(${scale})`;wrap.style.width=`${1050*scale}px`;wrap.style.height=`${500*scale}px`}
    async function render(){await document.fonts.ready;const prev=card.style.transform;card.style.transform='none';const canvas=await html2canvas(card,{scale:2,useCORS:true,backgroundColor:null});card.style.transform=prev;return canvas}
    function download(url,name){const a=document.createElement('a');a.href=url;a.download=name;a.click()}
    fields.forEach(k=>$(k).oninput=sync);colorFields.forEach(k=>$(k).oninput=sync);$('showPayments').onchange=sync;$('packageLogoInput').onchange=e=>{const file=e.target.files[0],image=$('packageLogoImage'),box=$('packageLogo');if(!file){image.removeAttribute('src');box.classList.remove('has-logo');return}const reader=new FileReader();reader.onload=()=>{image.src=reader.result;box.classList.add('has-logo')};reader.readAsDataURL(file)};document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>switchLang(b.dataset.lang));$('pngBtn').onclick=async()=>{try{const c=await render();download(c.toDataURL('image/png'),`sweater-package-${lang}.png`);toast('تم تصدير الكرت PNG')}catch(e){console.error(e);toast('تعذر التصدير')}};$('pdfBtn').onclick=async()=>{try{const c=await render(),{jsPDF}=window.jspdf,pdf=new jsPDF({orientation:'landscape',unit:'px',format:[1050,500]});pdf.addImage(c.toDataURL('image/png'),'PNG',0,0,1050,500);pdf.save(`sweater-package-${lang}.pdf`);toast('تم تصدير الكرت PDF')}catch(e){console.error(e);toast('تعذر التصدير')}};$('themeBtn').onclick=()=>document.documentElement.classList.toggle('dark');window.addEventListener('resize',fit);window.addEventListener('sweater:apply-admin-template',e=>{const p=e.detail?.payload||{};if(p.lang)switchLang(p.lang);fields.concat(colorFields).forEach(k=>{if(p[k]!=null)$(k).value=p[k]});if(p.showPayments!=null)$('showPayments').checked=!!p.showPayments;sync()});sync();setTimeout(fit,50);
  })();
  </script><script src="./site-config.js?v=13"></script><script src="./sweater-ui.js?v=9"></script><script src="./local-studio.js?v=8"></script>
</body></html>
